<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>資產配置管理器</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
:root {
  --bg:#0a0a0a; --surface:#151515; --surface2:#1e1e1e; --border:#282828;
  --gold:#c9a84c; --gold2:#e8c97a; --red:#e05555; --green:#4caf82;
  --text:#ededed; --text2:#9a9a9a; --muted:#5e5e5e;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;overflow-x:hidden;}

.header{padding:28px 20px 16px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#131313,var(--bg));position:sticky;top:0;z-index:100;}
.header-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;}
.app-title{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:4px;color:var(--text2);text-transform:uppercase;}
.total-label{font-size:11px;color:var(--muted);}
.total-value{font-family:'Space Mono',monospace;font-size:26px;font-weight:700;color:var(--gold2);letter-spacing:-1px;white-space:nowrap;flex-shrink:0;}

.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 20px;background:var(--bg);position:sticky;top:var(--hdr-h,76px);z-index:99;overflow-x:auto;}
.tab{font-size:11px;letter-spacing:2px;color:var(--muted);padding:13px 0;margin-right:24px;cursor:pointer;border-bottom:2px solid transparent;transition:all .1s;font-family:'Space Mono',monospace;text-transform:uppercase;white-space:nowrap;flex-shrink:0;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

.content{padding:16px 20px 120px;}
.section-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:10px;margin-top:20px;}

/* Group card */
.group-card{border-radius:14px;margin-bottom:16px;overflow:hidden;}
.group-header{padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.group-label{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;flex:1;}
.group-pct-badge{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--gold2);}
.group-toggle{font-size:12px;color:var(--muted);transition:transform .2s;}
.group-body{padding:0 12px 12px;}

/* Asset card */
.asset-card{background:linear-gradient(160deg,#1f1f1f,#181818);border:1px solid #2e2e2e;border-radius:14px;padding:15px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.03);transition:border-color .2s,box-shadow .2s;}
.asset-card:hover{border-color:#3a3a3a;box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);}
.asset-header{display:flex;align-items:center;margin-bottom:10px;gap:8px;}
.asset-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor;}
.asset-titles{flex:1;min-width:0;}
.asset-ticker{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--text);}
.asset-name{font-size:11px;color:var(--muted);margin-top:1px;}
.asset-pct-badge{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#1a1500;background:linear-gradient(135deg,var(--gold2),var(--gold));border:none;border-radius:20px;padding:4px 11px;white-space:nowrap;box-shadow:0 1px 4px rgba(201,168,76,.4);letter-spacing:.5px;}
.del-btn{width:30px;height:30px;border-radius:50%;background:rgba(224,85,85,.1);border:1px solid rgba(224,85,85,.25);color:var(--red);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,transform .15s,box-shadow .15s;}
.del-btn:hover{background:rgba(224,85,85,.22);transform:scale(1.08);box-shadow:0 0 10px rgba(224,85,85,.4);}
.del-btn:active{transform:scale(.95);}

.asset-row{display:flex;gap:8px;}
.input-group{flex:1;}
.input-label{font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:4px;font-family:'Space Mono',monospace;text-transform:uppercase;}
.input-field{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-family:'Space Mono',monospace;font-size:13px;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .2s;}
.input-field:focus{border-color:var(--gold);}
.input-field::placeholder{color:var(--muted);}

/* Slider */
.slider-row{margin-top:14px;padding:12px 12px 14px;background:rgba(0,0,0,.18);border-radius:10px;border:1px solid rgba(255,255,255,.04);}
.slider-labels{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.slider-lbl{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.slider-val{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--gold2);background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.25);border-radius:8px;padding:2px 10px;min-width:48px;text-align:center;}
/* ── Tech bar slider ──────────────────────────────── */
input[type=range]{
  -webkit-appearance:none;appearance:none;
  width:100%;height:6px;border-radius:99px;
  background:linear-gradient(to right,var(--gold) 0%,var(--gold2) var(--val,50%),#242424 var(--val,50%));
  outline:none;cursor:pointer;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.5);
}
/* Premium circular knob */
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff7e0, var(--gold) 65%);
  border:2px solid #fffaf0;cursor:grab;
  box-shadow:0 2px 6px rgba(0,0,0,.55), 0 0 0 1px rgba(201,168,76,.35), 0 0 12px rgba(201,168,76,.55);
  transition:transform .15s ease, box-shadow .15s ease;
}
input[type=range]:hover::-webkit-slider-thumb{
  transform:scale(1.18);
  box-shadow:0 3px 10px rgba(0,0,0,.6), 0 0 0 1px rgba(201,168,76,.6), 0 0 18px rgba(201,168,76,.85);
}
input[type=range]:active::-webkit-slider-thumb{ cursor:grabbing; transform:scale(1.08); }

/* Leverage slider — blue */
input[type=range].lev-slider{
  background:linear-gradient(to right,#4a8bc8 0%,#5b9bd5 var(--val,50%),#242424 var(--val,50%));
}
input[type=range].lev-slider::-webkit-slider-thumb{
  background:radial-gradient(circle at 35% 30%, #eaf3fb, #5b9bd5 65%);
  border-color:#f0f7fc;
  box-shadow:0 2px 6px rgba(0,0,0,.55), 0 0 0 1px rgba(91,155,213,.35), 0 0 12px rgba(91,155,213,.55);
}
input[type=range].lev-slider:hover::-webkit-slider-thumb{
  box-shadow:0 3px 10px rgba(0,0,0,.6), 0 0 0 1px rgba(91,155,213,.6), 0 0 18px rgba(91,155,213,.85);
}
/* Group pct slider */
input[type=range].grp-slider{
  background:linear-gradient(to right,var(--gold) 0%,var(--gold2) var(--val,50%),#242424 var(--val,50%));
}
input[type=range].grp-slider::-webkit-slider-thumb{
  background:radial-gradient(circle at 35% 30%, #fff7e0, var(--gold2) 65%);
}
/* Firefox */
input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff7e0, var(--gold) 65%);
  border:2px solid #fffaf0;cursor:grab;
  box-shadow:0 2px 6px rgba(0,0,0,.55), 0 0 12px rgba(201,168,76,.55);
}
input[type=range]::-moz-range-track{ height:6px;border-radius:99px;background:transparent; }
input[type=range].lev-slider::-moz-range-thumb{ background:radial-gradient(circle at 35% 30%, #eaf3fb, #5b9bd5 65%);border-color:#f0f7fc; }
input[type=range].grp-slider::-moz-range-thumb{ background:radial-gradient(circle at 35% 30%, #fff7e0, var(--gold2) 65%); }

/* Add panel */
.add-panel{background:var(--surface);border:1px dashed rgba(201,168,76,.35);border-radius:12px;padding:14px;margin-bottom:10px;}
.add-panel-title{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:12px;}
.add-row{display:flex;gap:8px;flex-wrap:wrap;}
.add-row .input-group{flex:1;min-width:72px;}
.add-btn{width:100%;background:var(--gold);color:#0a0a0a;border:none;border-radius:10px;padding:13px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;font-weight:700;text-transform:uppercase;cursor:pointer;margin-top:10px;}
.add-btn:active{background:var(--gold2);}

/* Withdraw */
.withdraw-card{background:var(--surface);border:1px solid rgba(201,168,76,.3);border-radius:12px;padding:14px;margin-bottom:10px;}
.withdraw-title{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:3px;color:var(--gold);margin-bottom:10px;text-transform:uppercase;}
.calc-btn{width:100%;background:var(--gold);color:#0a0a0a;border:none;border-radius:12px;padding:15px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;font-weight:700;text-transform:uppercase;cursor:pointer;margin-top:8px;}
.calc-btn:active{background:var(--gold2);}

/* Summary */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;}
.summary-card-label{font-size:13px;color:#9a9a9a;margin-bottom:6px;font-family:'Noto Sans TC',sans-serif;font-weight:500;}
.summary-card-value{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:var(--gold2);}
.summary-card-value.positive{color:var(--green);}
.summary-card-value.negative{color:var(--red);}
@media (max-width:360px){ .summary-card-value{font-size:16px;} }

.action-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:10px;}
.action-row{display:flex;justify-content:space-between;align-items:stretch;padding:11px 0;border-bottom:1px solid var(--border);min-height:62px;box-sizing:border-box;}
.action-row:last-child{border-bottom:none;padding-bottom:0;}
.action-row:first-child{padding-top:0;}
.action-ticker{font-family:'Space Mono',monospace;font-size:17px;font-weight:700;line-height:1.4;}
.action-detail{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.action-amount{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;line-height:1.4;white-space:nowrap;}
.buy{color:var(--green);}.sell{color:var(--red);}.hold{color:var(--muted);}

/* Group rebalance section */
.group-rebal{background:var(--surface);border-radius:16px;margin-bottom:16px;overflow:hidden;}
.group-rebal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.group-rebal-title{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:2px;}
.group-rebal-body{padding:8px 22px 12px;}

/* Returns */
.annual-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;}
.annual-row:last-child{border-bottom:none;}

/* Pct warning */
.pct-warning{font-family:'Space Mono',monospace;font-size:10px;text-align:center;padding:8px;border-radius:8px;margin-top:4px;}
.pct-ok{color:var(--green);background:rgba(76,175,130,.08);}
.pct-bad{color:var(--red);background:rgba(224,85,85,.08);}

.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* Donut */
.chart-wrap{display:flex;align-items:center;padding:16px 4px 8px;gap:20px;}
.donut-holder{position:relative;width:128px;height:128px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.donut-center-label{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:3px;}
.donut-center-value{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--text);letter-spacing:-.5px;}
svg.donut{width:128px;height:128px;flex-shrink:0;transform:rotate(-90deg);filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));}
.donut-legend{flex:1;}
.legend-item{display:flex;align-items:center;margin-bottom:9px;}
.legend-dot{width:9px;height:9px;border-radius:3px;margin-right:9px;flex-shrink:0;box-shadow:0 0 6px currentColor;}
.legend-ticker{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;flex:1;color:var(--text);}
.legend-pct{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--text2);}

/* ── Desktop layout ─────────────────────────────────── */
@media (min-width: 768px) {
  body {
    background:#050505 !important;
    min-height:100vh;
    margin:0; padding:0;
  }
  .app-shell {
    width:100%;
    max-width:480px;
    margin:0 auto;
    background:var(--bg);
    box-shadow:0 0 80px rgba(0,0,0,.9);
    min-height:100vh;
  }
  /* Single fixed wrapper for header + tabs — no height guessing needed */
  .fixed-top {
    position:fixed !important;
    top:0 !important;
    left:50% !important;
    transform:translateX(-50%) !important;
    width:100% !important;
    max-width:480px !important;
    z-index:200 !important;
    background:var(--bg) !important;
    box-sizing:border-box !important;
    overflow:visible !important;
  }
  /* Reset header & tabs to normal flow inside fixed-top */
  .header {
    position:static !important;
    padding:24px 28px 14px !important;
    background:linear-gradient(180deg,#131313,var(--bg)) !important;
    box-sizing:border-box !important;
  }
  .acct-bar {
    padding:8px 28px !important;
  }
  .tabs {
    position:static !important;
    padding:0 28px !important;
    background:var(--bg) !important;
    box-sizing:border-box !important;
  }
  /* Content padding: enough to clear fixed-top (measured by JS below) */
  .content {
    padding-left:28px !important;
    padding-right:28px !important;
    padding-bottom:120px !important;
  }
  .asset-ticker { font-size:16px !important; }
  .input-field  { font-size:14px !important; padding:12px !important; }
  .total-value  { font-size:30px !important; }
}

/* ── Back to top ─────────────────────────────────── */
.top-btn{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:50%;
  background:rgba(21,21,21,.92);border:1px solid rgba(201,168,76,.45);color:var(--gold2);font-size:17px;font-weight:700;
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:300;
  box-shadow:0 4px 14px rgba(0,0,0,.55);opacity:0;pointer-events:none;transform:translateY(8px);
  transition:opacity .2s,transform .2s;-webkit-tap-highlight-color:transparent;}
.top-btn.show{opacity:1;pointer-events:auto;transform:translateY(0);}
.top-btn:active{transform:scale(.92);}
@media (min-width:768px){ .top-btn{right:calc(50% - 240px + 16px);} }

/* ── Account switcher ───────────────────────────────── */
.acct-bar{
  display:flex;align-items:center;gap:6px;
  padding:8px 20px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.acct-btn{
  flex:1;padding:8px 0;border-radius:8px;
  font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
  letter-spacing:1px;cursor:pointer;border:1px solid var(--border);
  background:none;color:var(--muted);transition:all .2s;
}
.acct-btn.active{
  background:var(--gold);color:#0a0a0a;border-color:var(--gold);
}
.acct-btn.active.b{
  background:#5b9bd5;border-color:#5b9bd5;color:#fff;
}
.acct-edit{
  width:24px;height:24px;border-radius:6px;background:none;
  border:1px solid var(--border);color:var(--muted);
  font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}

/* ── Exchange rate ──────────────────────────────────── */
.usd-hint{font-family:'Space Mono',monospace;font-size:11px;color:#5b9bd5;margin-top:5px;letter-spacing:.5px;}
.rate-row{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(91,155,213,.06);border-radius:8px;margin-bottom:10px;border:1px solid rgba(91,155,213,.2);}
.rate-label{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;flex-shrink:0;}
.rate-input{background:none;border:none;border-bottom:1px solid rgba(91,155,213,.4);color:#5b9bd5;font-family:'Space Mono',monospace;font-size:14px;font-weight:700;width:80px;outline:none;text-align:center;padding:2px 4px;}
.rate-flag{font-size:13px;}

/* ── Price display ──────────────────────────────────── */
.price-row{display:flex;align-items:center;gap:8px;margin:8px 0;padding:8px 10px;
  background:rgba(201,168,76,.06);border-radius:8px;border:1px solid rgba(201,168,76,.15);}
.price-fetch-btn{width:26px;height:26px;border-radius:6px;background:rgba(201,168,76,.12);
  border:1px solid rgba(201,168,76,.3);color:var(--gold);font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.shares-input{width:90px !important;}

/* ── Drift alert ──────────────────────────────────── */

.pnl-positive{ color:var(--green); }
.pnl-negative{ color:var(--red); }
.pnl-zero{ color:var(--muted); }

/* ── Utility cards ──────────────────────────────── */
.util-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  transition:opacity .2s, outline .15s;
}
.util-card.dragging{ opacity:0.5; }
.util-card.drag-over{ outline:2px solid var(--gold); }
/* 桌機瀏覽器的數字輸入框上下箭頭會撐爆小輸入框 — 全域隱藏 */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
</style>
</head>
<body>
<div class="app-shell">

<div class="fixed-top"><div class="header">
  <div class="header-top">
    <span class="app-title">Portfolio</span>
    
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
    <div class="total-value" id="totalDisplay">—</div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
      <span id="cloudIndicator" style="font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);opacity:0.35;white-space:nowrap"></span>
      <span id="saveStatus" style="font-family:'Space Mono',monospace;font-size:9px;color:var(--green);letter-spacing:1px;opacity:0.5;transition:opacity .4s"></span>
      <span id="refreshCountdown" style="font-family:'Space Mono',monospace;font-size:9px;color:var(--gold2);letter-spacing:1px;opacity:0.7"></span>
      <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">
        
        
        <button onclick="cloudSync()" style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;color:#9b7fd4;background:rgba(155,127,212,.12);border:1px solid rgba(155,127,212,.35);border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap;">雲端</button>
        <button id="fetchAllBtn" onclick="fetchAllPrices()" style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0;color:var(--gold2);background:rgba(232,201,122,.12);border:1px solid rgba(232,201,122,.35);border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap;">更新報價</button>
        <button onclick="saveData();switchTab('rebalance')" style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0;color:#5b9bd5;background:rgba(91,155,213,.12);border:1px solid rgba(91,155,213,.35);border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap;">再平衡</button>
        <button onclick="clearData()" style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap;">重置</button>
      </div>
      <input type="file" id="importInput" accept=".json" style="display:none" onchange="importJSON(event)">
    </div>
  </div>
</div>

<div class="acct-bar" id="acctBar">
    <button class="acct-btn active" id="acctBtnA" onclick="switchAccount('A')">帳戶 A</button>
    <button class="acct-btn b" id="acctBtnB" onclick="switchAccount('B')">帳戶 B</button>
    <button class="acct-edit" id="acctEditBtn" onclick="editAccountName()" title="重新命名">✎</button>
  </div>
  <div class="tabs">
  <div class="tab active" onclick="switchTab('overview')">總覽</div>
  <div class="tab" onclick="switchTab('holdings')">持倉</div>
  <div class="tab" onclick="switchTab('rebalance')">再平衡</div>
  <div class="tab" onclick="switchTab('dipbuy')">加碼</div>
  <div class="tab" onclick="switchTab('returns')">報酬試算</div>
  <div class="tab" onclick="switchTab('risk')">壓力測試</div>
</div></div><!-- end fixed-top -->

<div class="content">

<script>
// ── Palette ───────────────────────────────────────────────────────────────────
// Update slider gradient fill based on current value
function updateSliderFill(slider){
  if(!slider) return;
  const min = parseFloat(slider.min)||0;
  const max = parseFloat(slider.max)||100;
  const val = parseFloat(slider.value)||0;
  const ratio = (max>min) ? (val - min) / (max - min) : 0;
  // Account for thumb width: thumb centre travels from (thumbW/2) to (trackW - thumbW/2)
  const thumbW = 28;
  const trackW = slider.offsetWidth || 300;
  const centerPx = (thumbW/2) + ratio * (trackW - thumbW);
  const pct = (centerPx / trackW * 100).toFixed(2)+'%';
  slider.style.setProperty('--val', pct);
}
// 拖動時間戳：range 在 iOS 觸控下不會取得 focus，改用時間窗判定「拖動中」
let _sliderTouch = 0;
function sliderRecentlyActive(){ return Date.now() - _sliderTouch < 1200; }
// Apply to all sliders on input
document.addEventListener('input', e=>{
  if(e.target && e.target.type==='range') _sliderTouch = Date.now();
  if(e.target && e.target.type==='range') updateSliderFill(e.target);
});

const PALETTE = ['#c9a84c','#4caf82','#5b9bd5','#e05555','#9b7fd4',
                 '#e8944a','#4bc4cf','#b5cc3f','#d45b8a','#7ec8a4'];
function colorFor(i){ return PALETTE[i % PALETTE.length]; }

// ── Group colors ──────────────────────────────────────────────────────────────
const GROUP_COLORS = { '美股': '#5b9bd5', '台股': '#c9a84c' };
function groupColor(gid){
  const g = groups.find(x=>x.id===gid);
  return g ? (GROUP_COLORS[g.name] || '#888') : '#888';
}

// ── Data model ────────────────────────────────────────────────────────────────
let uid = 0, gid = 0;
const groupOpenState = {}; // { groupId: true/false } — true = open
// Lock tracking for sliders
const lockedInner  = {}; // { groupId: Set<assetId> }
const lockedGroups = new Set(); // Set<groupId>
let exchangeRate = Number(localStorage.getItem('exchangeRate')) || 32;
// 下跌加碼階梯（門檻按2倍槓桿校準：正二回檔約為大盤2倍，太淺會過早耗盡子彈）
function defaultDipBuy(){
  return { anchor:null, reserve:0, targetExp:100, tiers:[
    {dd:30, pct:15, done:false},
    {dd:45, pct:35, done:false},
    {dd:60, pct:50, done:false}
  ]};
}
let dipBuy = defaultDipBuy();
function makeGroup(name, pct, currency) { return { id: ++gid, name, pct, currency: currency||'TWD' }; }
function makeAsset(groupId, ticker, name, innerPct, current, rate, leverage) {
  return { id: ++uid, groupId, ticker, name,
           innerPct: innerPct||0, current: current||0,
           rate: rate||0, leverage: leverage!=null?leverage:1,
           shares: 0, lastPrice: null, lastPriceAt: null,
           costBasis: 0 };
}

let groups = [
  makeGroup('美股', 50, 'USD'),
  makeGroup('台股', 50, 'TWD'),
];
let assets = [
  makeAsset(1, 'VT',      'Vanguard全球股票',  40, 0, 10.58, 1),
  makeAsset(1, 'QQQ',     'Invesco那斯達克100', 40, 0,       21.9,  1),
  makeAsset(1, 'SMH',     'VanEck半導體ETF',   20, 0, 31.3,  1),
  makeAsset(2, '00631L',  '元大台灣50正2',      50, 0, 45.5,  2),
  makeAsset(2, '正二現金', '備用加碼金',         50, 0, 0,     0),
];

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmt(n){ return Math.round(n).toLocaleString('zh-TW'); }
// 股數顯示（全 app 統一規則：≥10 取整、1–10 一位小數、<1 三位小數）；無報價回傳 null
function fmtShares(amtTWD, price){
  if(!price || price<=0 || !isFinite(amtTWD)) return null;
  const sh = Math.abs(amtTWD)/price;
  const shD = sh>=10 ? Math.round(sh).toLocaleString() : sh>=1 ? sh.toFixed(1) : sh.toFixed(3);
  return '約 '+shD+' 股 @ NT$ '+price.toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2});
}


function totalCurrent(){ return assets.reduce((s,a)=>s+a.current,0); }
function withdraw(){ return Number(document.getElementById('withdrawInput').value)||0; }
function assetIndex(id){ return assets.findIndex(a=>a.id===id); }
function groupIndex(id){ return groups.findIndex(g=>g.id===id); }
function assetsInGroup(gid){ return assets.filter(a=>a.groupId===gid); }

// Effective % of total for an asset
// Normalize inner pcts so group always sums to its full group.pct
function assetEffectivePct(a){
  const g = groups.find(x=>x.id===a.groupId);
  if (!g) return 0;
  const gAssets = assetsInGroup(g.id);
  const innerSum = gAssets.reduce((s,x)=>s+x.innerPct, 0);
  // If inner pcts don't sum to 100, normalize proportionally
  const normalizedInner = innerSum > 0 ? a.innerPct / innerSum * 100 : 0;
  return g.pct * normalizedInner / 100;
}

// ── Build group cards (once) ──────────────────────────────────────────────────
function buildGroupCards(){
  // Reset all locks on rebuild
  Object.keys(lockedInner).forEach(k=>delete lockedInner[k]);
  lockedGroups.clear();
  // Hide all lock indicators
  document.querySelectorAll('[id^="lock-"]').forEach(el=>{ if(el.id.match(/^lock-\d+$/)) el.style.display='none'; });
  const container = document.getElementById('groupCards');
  container.innerHTML = '';
  groups.forEach(g => {
    const gc = document.createElement('div');
    gc.className = 'group-card';
    gc.id = 'gcard-'+g.id;
    gc.style.border = '1px solid '+groupColor(g.id)+'44';
    gc.style.background = 'rgba('+hexToRgb(groupColor(g.id))+',0.04)';
    gc.draggable = true;
    gc.addEventListener('dragstart', e=>{
      // Only allow drag if it started from the drag handle
      const handle = e.target.closest ? e.target.closest('.grp-drag-handle') : null;
      const isHandle = handle || (e.target && e.target.classList && e.target.classList.contains('grp-drag-handle'));
      if(!isHandle){ e.preventDefault(); return; }
      e.dataTransfer.setData('groupId', g.id);
      gc.style.opacity='0.5';
    });
    gc.addEventListener('dragend', e=>{ gc.style.opacity='1'; });
    gc.addEventListener('dragover', e=>{ e.preventDefault(); gc.style.outline='2px solid '+groupColor(g.id); });
    gc.addEventListener('dragleave', e=>{ gc.style.outline='none'; });
    gc.addEventListener('drop', e=>{
      e.preventDefault(); gc.style.outline='none';
      const fromId = Number(e.dataTransfer.getData('groupId'));
      const toId = g.id;
      if(fromId === toId) return;
      const fromIdx = groups.findIndex(x=>x.id===fromId);
      const toIdx   = groups.findIndex(x=>x.id===toId);
      if(fromIdx<0||toIdx<0) return;
      const [moved] = groups.splice(fromIdx,1);
      groups.splice(toIdx,0,moved);
      // State is already saved in groupOpenState — buildGroupCards will restore it
      buildGroupCards(); updateCalc();
    });
    gc.innerHTML = `
      <div class="group-header" onclick="toggleGroup(${g.id})" style="flex-direction:column;align-items:stretch;gap:4px">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="grp-drag-handle" style="cursor:grab;font-size:14px;color:var(--muted);flex-shrink:0;padding:2px 4px;border-radius:4px" title="拖拉換序">⠿</div>
          <div style="width:10px;height:10px;border-radius:3px;background:${groupColor(g.id)};flex-shrink:0"></div>
          <div class="group-label" style="color:${groupColor(g.id)};font-size:15px">${g.name}</div>
          <span class="group-toggle" id="gtoggle-${g.id}" style="margin-left:auto">▼</span>
        </div>
        <div style="text-align:center;padding:6px 0 2px">
          <div style="font-family:'Space Mono',monospace;font-size:30px;font-weight:700;color:${groupColor(g.id)};line-height:1" id="gpct-${g.id}">${g.pct}%</div>
          <div style="font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);margin-top:5px" id="gamt-${g.id}"></div>
        </div>
      </div>
      <div class="group-body" id="gbody-${g.id}">
        <!-- Group-level pct slider -->
        <div style="padding:0 2px 12px;border-bottom:1px solid var(--border);margin-bottom:10px">
          <input type="range" class="grp-slider" id="gslider-${g.id}" min="0" max="100" step="1" value="${g.pct}"
            oninput="syncGroupSlider(${g.id}, this.value)">
        </div>
        ${g.currency==='USD' ? `
        <div class="rate-row" id="rateRow-${g.id}">
          <span class="rate-flag">🇺🇸</span>
          <span class="rate-label">USD / TWD</span>
          <span class="rate-label" style="color:#5b9bd5">1 USD =</span>
          <input class="rate-input" id="rateInput-${g.id}" type="number"
            inputmode="decimal" step="0.1" value="${exchangeRate}"
            oninput="updateExchangeRate(this.value)">
          <span class="rate-label" style="color:#5b9bd5">TWD</span>
          <button onclick="fetchRate()" style="margin-left:auto;font-family:'Space Mono',monospace;font-size:9px;color:#5b9bd5;background:rgba(91,155,213,.1);border:1px solid rgba(91,155,213,.3);border-radius:6px;padding:3px 8px;cursor:pointer;letter-spacing:1px;">更新</button>
        </div>` : ''}
        <!-- Mini summary row — always visible -->
        <div id="gmini-${g.id}" style="margin-bottom:10px"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <div class="section-label" style="margin:0;font-size:9px">持倉資產</div>
          <button onclick="toggleGroupAssets(${g.id})" id="grpToggleBtn-${g.id}"
            style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;font-weight:700;
            color:${groupColor(g.id)};background:${groupColor(g.id)}1f;border:1px solid ${groupColor(g.id)}66;
            border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap">
            收合 ▲
          </button>
        </div>
        <div id="gassets-${g.id}"></div>
        <div id="quickRebal-${g.id}" style="display:none;margin-top:8px"></div>
      </div>`;
    // Restore open/closed state (default open if not set)
    const isOpen = groupOpenState[g.id] !== false; // default open
    const bodyEl = gc.querySelector('#gbody-'+g.id);
    const togEl  = gc.querySelector('#gtoggle-'+g.id);
    if(bodyEl){ bodyEl.style.display = isOpen ? 'block' : 'none'; }
    if(togEl)  { togEl.style.transform = isOpen ? '' : 'rotate(-90deg)'; }
    container.appendChild(gc);
  });
  buildAssetCards();
}

function hexToRgb(hex){
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return r+','+g+','+b;
}

function toggleGroup(id){
  const body = document.getElementById('gbody-'+id);
  const tog  = document.getElementById('gtoggle-'+id);
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  if(tog) tog.style.transform = open ? 'rotate(-90deg)' : '';
  groupOpenState[id] = !open; // save state
}

// ── Build asset cards inside groups ──────────────────────────────────────────
function buildAssetCards(){
  const _bLev = dipLevAsset(), _bCash = dipCashAsset(_bLev);
  const _pairIds = new Set([_bLev&&_bLev.id, _bCash&&_bCash.id].filter(x=>x!=null));
  groups.forEach(g => {
    const container = document.getElementById('gassets-'+g.id);
    if(!container) return;
    container.innerHTML = '';
    assetsInGroup(g.id).forEach((a,ai) => {
      const color = colorFor(assets.findIndex(x=>x.id===a.id));
      const g_obj = groups.find(x=>x.id===a.groupId);
      const isUSD = g_obj && g_obj.currency === 'USD';
      const card = document.createElement('div');
      card.className = 'asset-card';
      card.id = 'card-'+a.id;
      card.innerHTML = `
        <div class="asset-header">
          <div class="asset-dot" style="background:${color};color:${color}"></div>
          <div class="asset-titles">
            <div class="asset-ticker">${a.ticker}</div>
            <div class="asset-name">${a.name||''}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;margin-right:6px">
            <span style="font-family:'Space Mono',monospace;font-size:10px;color:var(--muted)">群組內</span>
            <span class="asset-pct-badge" id="badge-${a.id}">${Math.round(a.innerPct)}%</span>
          </div>
          <button class="del-btn" onclick="removeAsset(${a.id})">×</button>
        </div>
        <div class="asset-row">
          <div class="input-group">
            <div class="input-label">${isUSD ? '金額 (USD $)' : '現有金額'}</div>
            <input class="input-field" id="cur-${a.id}" type="number" inputmode="decimal"
              value="${isUSD ? (a.current/exchangeRate).toFixed(0) : a.current}" placeholder="0"
              style="${isUSD ? 'border-color:rgba(91,155,213,.4)' : ''}">
            ${isUSD ? `<div class="usd-hint" id="twd-${a.id}">≈ NT$ ${Math.round(a.current).toLocaleString('zh-TW')}</div>` : ''}
          </div>
          <div class="input-group" style="max-width:64px">
            <div class="input-label">槓桿</div>
            <input class="input-field" id="lev-${a.id}" type="number" inputmode="decimal" step="0.5" min="0" value="${a.leverage}" placeholder="1">
          </div>
        </div>
        <div class="slider-row">
          <div class="slider-labels">
            <span class="slider-lbl">群組內比例 ${_pairIds.has(a.id)?'<span style="color:var(--gold2);font-size:10px"> 🎯拉動＝調整目標曝險</span>':''}<span id="lock-${a.id}" onclick="unlockInner(${a.id})" style="color:var(--gold2);font-size:10px;display:none;cursor:pointer"> 🔒已鎖定 (點此解鎖)</span></span>
            <span class="slider-val" id="badge2-${a.id}">${Math.round(a.innerPct)}%</span>
          </div>

      container.appendChild(card);
      // Restore price and P&L display for this asset

      // cur- and lev- need both input+change events

// ── Slider sync ───────────────────────────────────────────────────────────────
function syncGroupSlider(id, val){
  const idx = groupIndex(id); if(idx<0) return;
  const v = Number(val);
  groups[idx].pct = v;

  // Track locked groups
  lockedGroups.add(id);

  const siblings = groups.filter(g=>g.id!==id);
  const locked   = siblings.filter(g=>lockedGroups.has(g.id));
  const unlocked = siblings.filter(g=>!lockedGroups.has(g.id));

  const lockedSum = locked.reduce((s,g)=>s+g.pct, 0);
  const remaining = 100 - v - lockedSum;

  const targets = {};
  if(unlocked.length > 0){
    const unlockedSum = unlocked.reduce((s,g)=>s+g.pct, 0);
    let allocated = 0;
    unlocked.forEach((g, i)=>{
      let newPct;
      if(i === unlocked.length-1){
        newPct = Math.max(0, remaining - allocated);
      } else {
        newPct = unlockedSum>0
          ? Math.max(0, Math.round(g.pct/unlockedSum*remaining))
          : Math.max(0, Math.round(remaining/unlocked.length));
        allocated += newPct;
      }
      targets[g.id] = newPct;
    });
  } else {
    if(locked.length > 0){
      targets[locked[0].id] = Math.max(0, locked[0].pct + remaining);
    }
  }

  // Apply
  Object.entries(targets).forEach(([gidStr, newPct])=>{
    const gi = groupIndex(Number(gidStr)); if(gi<0) return;
    groups[gi].pct = newPct;
    const osl  = document.getElementById('gslider-'+gidStr);
    const ogpt = document.getElementById('gpct-'+gidStr);
    if(osl && osl!==document.activeElement){ osl.value=newPct; updateSliderFill(osl); }
    if(ogpt) ogpt.textContent = newPct+'%';
  });

  const b2 = document.getElementById('gpct-'+id);
  const thisSl = document.getElementById('gslider-'+id);
  if(b2) b2.textContent = v+'%';
  if(thisSl) updateSliderFill(thisSl);
  updateCalc();
}


function unlockInner(id){
  const a = assets[assetIndex(id)]; if(!a) return;
  const gid = a.groupId;
  if(lockedInner[gid]) lockedInner[gid].delete(id);
  const lockEl = document.getElementById('lock-'+id);
  if(lockEl) lockEl.style.display = 'none';
}

function syncPctSlider(id, val){
  const idx = assetIndex(id); if(idx<0) return;
  // 配對滑桿＝曝險手勢：拖動即時預覽對應曝險，放手（onchange→pairSliderCommit）才寫入目標
  const _plev = dipLevAsset(), _pcash = dipCashAsset(_plev);
  if(_plev && _pcash && (id===_plev.id || id===_pcash.id)){
    const c = dipPairContext();
    if(c){
      const pairSum = (c.lev.innerPct + c.cash.innerPct) || 100;
      const levShare = (id===c.lev.id) ? Number(val) : pairSum - Number(val);
      const frac = Math.min(Math.max(levShare/pairSum, 0), 1);
      const exp = c.fixedExp + c.pairEff*c.cashL + frac*c.pairEff*c.L;
      // 吸附到最接近的「整數曝險」，並反推對應的組內占比 → 拉桿精準落在 …119/120/121…
      const snapExp = Math.round(exp);
      const snapShare = (c.pairEff>0 && c.L>0)
        ? Math.min(Math.max((snapExp - c.fixedExp - c.pairEff*c.cashL)/(c.pairEff*c.L), 0), 1) * pairSum
        : levShare;
      const shownShare = (id===c.lev.id) ? snapShare : pairSum - snapShare;
      const b = document.getElementById('badge2-'+id);
      if(b) b.textContent = Math.round(shownShare)+'% ＝'+snapExp+'%曝險';
      const other = (id===c.lev.id) ? c.cash : c.lev;
      const os = document.getElementById('pctSlider-'+other.id);
      if(os){ os.value = pairSum - shownShare; if(typeof updateSliderFill==='function') updateSliderFill(os); }
      const ob = document.getElementById('badge2-'+other.id);
      if(ob) ob.textContent = Math.round((pairSum - shownShare)*10)/10+'%';
      // 目標金額即時預覽（口徑與 refreshHoldings 一致：after × 群組% × 組內占比）
      const g = groups.find(x=>x.id===c.lev.groupId);
      if(g){
        const gAssets = assetsInGroup(g.id);
        const innerSum = gAssets.reduce((s,x)=>s+x.innerPct,0) || 100;
        const after = Math.max(0, totalCurrent() - withdraw());
        const cashShare = pairSum - snapShare;
        const tgtLev  = Math.round(after * (g.pct * (snapShare /innerSum*100) /100) / 100);
        const tgtCash = Math.round(after * (g.pct * (cashShare/innerSum*100) /100) / 100);
        const tl = document.getElementById('tgt-'+c.lev.id);
        if(tl) tl.textContent = '目標 → $'+fmt(tgtLev);
        const tc = document.getElementById('tgt-'+c.cash.id);
        if(tc) tc.textContent = '目標 → $'+fmt(tgtCash);
      }
    }
    return;
  }
  const v = Number(val);

  const a = assets[idx];
  const gid = a.groupId;
  const groupAssets = assetsInGroup(gid);

  // Track locked sliders per group
  if(!lockedInner[gid]) lockedInner[gid] = new Set();
  lockedInner[gid].add(id);
  // Show lock indicator for this asset
  const lockEl = document.getElementById('lock-'+id);
  if(lockEl) lockEl.style.display = 'inline';

  const siblings = groupAssets.filter(x=>x.id!==id);
  const locked   = siblings.filter(x=>lockedInner[gid].has(x.id));
  const unlocked = siblings.filter(x=>!lockedInner[gid].has(x.id));

  const lockedSum  = locked.reduce((s,x)=>s+x.innerPct, 0);
  const maxAllowed = 100 - lockedSum; // can't exceed remaining room

  let effV = v;
  const targets = {};
  if(unlocked.length > 0){
    // There are unlocked siblings to absorb — distribute remaining to them
    const remaining = Math.max(0, 100 - v - lockedSum);
    const unlockedSum = unlocked.reduce((s,x)=>s+x.innerPct, 0);
    let allocated = 0;
    unlocked.forEach((sib, i)=>{
      let newPct;
      if(i === unlocked.length-1){
        newPct = Math.max(0, remaining - allocated);
      } else {
        newPct = unlockedSum>0
          ? Math.max(0, Math.round(sib.innerPct/unlockedSum*remaining))
          : Math.max(0, Math.round(remaining/unlocked.length));
        allocated += newPct;
      }
      targets[sib.id] = newPct;
    });
  } else {
    // ALL siblings locked — locked ones NEVER move.
    // Cap this slider at the remaining room so the sum stays 100 without touching locked.
    effV = Math.min(v, maxAllowed);
  }

  // Apply capped value to this asset
  assets[idx].innerPct = effV;

  // Apply targets to DOM + assets
  Object.entries(targets).forEach(([sibId, newPct])=>{
    const si = assetIndex(Number(sibId)); if(si<0) return;
    assets[si].innerPct = newPct;
    const sSlider = document.getElementById('pctSlider-'+sibId);
    const sBadge  = document.getElementById('badge-'+sibId);
    const sBadge2 = document.getElementById('badge2-'+sibId);
    if(sSlider && sSlider!==document.activeElement){ sSlider.value=newPct; updateSliderFill(sSlider); }
    if(sBadge)  sBadge.textContent  = newPct+'%';
    if(sBadge2) sBadge2.textContent = newPct+'%';
  });

  // Update this slider (use effV — may be capped if all siblings locked)
  const inp    = document.getElementById('badge-'+id);
  const b2     = document.getElementById('badge2-'+id);
  const thisSl = document.getElementById('pctSlider-'+id);
  if(inp) inp.textContent = effV+'%';
  if(b2)  b2.textContent  = effV+'%';
  if(thisSl){
    // If value was capped, snap the slider back to the allowed max
    if(effV !== v) thisSl.value = effV;
    updateSliderFill(thisSl);
  }
  updateCalc();
}


// ── Refresh Holdings ──────────────────────────────────────────────────────────
function refreshHoldings(){
  const total = totalCurrent();
  document.getElementById('totalDisplay').textContent = '$'+fmt(total);
  fitTotalValue();
  const w = Math.min(withdraw(), total); // clamp: cannot withdraw more than total
  const after = Math.max(0, total - w);

  // Current exposure (actual holdings)
  const totalExpCur = assets.reduce((s,a)=>s+a.current*(a.leverage!=null?a.leverage:1),0);

  // Target exposure (after rebalance) — reflects slider changes immediately
  const wExp = Math.min(withdraw(), total);
  const afterExp = Math.max(0, total - wExp);
  const totalExp = assets.reduce((s,a)=>{
    const lev = a.leverage!=null?a.leverage:1;
    const tgt = afterExp * assetEffectivePct(a) / 100;
    return s + tgt * lev;
  }, 0);
  const totalExpPct = afterExp>0?(totalExp/afterExp*100):0;

  // Per-asset
  assets.forEach((a,i) => {
    const lev = a.leverage!=null?a.leverage:1;
    const effPct = assetEffectivePct(a);
    const tgt = Math.round(after * effPct / 100);
    const exposure = a.current * lev;
    // expPct: target exposure as % of after (reflects slider changes immediately)
    const tgtAmt = afterExp * effPct / 100;
    const tgtExposure = tgtAmt * lev;
    const expPct = afterExp>0 ? (tgtExposure/afterExp*100) : 0;

    const badge  = document.getElementById('badge-'+a.id);
    const badge2 = document.getElementById('badge2-'+a.id);
    const tgtEl  = document.getElementById('tgt-'+a.id);
    const expEl  = document.getElementById('exp-'+a.id);
    // Update TWD hint only (don't touch input value — buildAssetCards handles it)
    const twdHint = document.getElementById('twd-'+a.id);
    if(twdHint) twdHint.textContent = '≈ NT$ '+Math.round(a.current).toLocaleString('zh-TW');
    const ps     = document.getElementById('pctSlider-'+a.id);


    const psActive = (ps&&(ps===document.activeElement)) || sliderRecentlyActive();
    if(badge)         badge.textContent  = Math.round(a.innerPct)+'%';
    if(badge2&&!psActive) badge2.textContent = Math.round(a.innerPct)+'%';
    if(ps&&!psActive) ps.value = a.innerPct;
    if(tgtEl) tgtEl.textContent = '目標 → $'+fmt(tgt);
    if(expEl){
      if(lev===0){ expEl.textContent='現金 (0×)'; expEl.style.color='var(--muted)'; }
      else{
        expEl.textContent = expPct.toFixed(1)+'% 曝險 ('+lev+'×)';
        expEl.style.color = lev>1?'var(--red)':'var(--gold2)';
      }
    }
  });

  // Group labels
  groups.forEach(g => {
    const gAmt = assetsInGroup(g.id).reduce((s,a)=>s+a.current,0);
    const gsl  = document.getElementById('gslider-'+g.id);
    const gpct = document.getElementById('gpct-'+g.id);
    const gamt = document.getElementById('gamt-'+g.id);
    const gsActive = gsl&&(gsl===document.activeElement);
    if(gsl&&!gsActive) gsl.value = g.pct;
    if(gpct) gpct.textContent = g.pct+'%';
    if(gamt) gamt.textContent = '$'+fmt(gAmt);



    // Quick rebalance hint
    renderQuickRebal(g.id, after);
  });



  // ── 兩層偏移監測（相對偏離 = (實際−目標)/目標）────────────────────────────
  // 第一層：台股 : 美股 兩大群組
  const layer1 = groups.map(g=>{
    const gAmt = assetsInGroup(g.id).reduce((s,a)=>s+a.current,0);
    const actual = total>0 ? gAmt/total*100 : 0;
    const relDev = g.pct>0 ? (actual-g.pct)/g.pct*100 : 0;
    return {g, actual, target:g.pct, relDev};
  });
  // 第二層：各群組內部（美股只比VT/QQQ/SMH之間；台股只比00631L/正二現金之間）
  const layer2 = [];
  groups.forEach(g=>{
    const ga2 = assetsInGroup(g.id);
    const gAmt = ga2.reduce((s,a)=>s+a.current,0);
    const innerSum2 = ga2.reduce((s,a)=>s+a.innerPct,0)||1;
    if(gAmt<=0) return;
    ga2.forEach(a=>{
      const tgtInner = a.innerPct/innerSum2*100;
      if(tgtInner<=0) return;
      const actInner = a.current/gAmt*100;
      layer2.push({ label:a.ticker, groupName:g.name,
        relDev:(actInner-tgtInner)/tgtInner*100, actual:actInner, target:tgtInner });
    });
  });
  // 30% 警示資料
  const driftAlerts = [
    ...layer1.filter(d=>Math.abs(d.relDev)>=30).map(d=>({label:d.g.name, relDev:d.relDev, layer:'第一層'})),
    ...layer2.filter(d=>Math.abs(d.relDev)>=30).map(d=>({label:d.groupName+'·'+d.label, relDev:d.relDev, layer:'群組內'}))
  ];

  // ── Update P&L ────────────────────────────────────────────────────────────
  assets.forEach(a=>updatePnlDisplay(a.id));

  // ── Combined Exposure + Drift card ────────────────────────────────────────
  const expSum = document.getElementById('expSummary');
  if(expSum){
    const cashPct = assets.filter(a=>(a.leverage!=null?a.leverage:1)===0)
                          .reduce((s,a)=>s+assetEffectivePct(a),0);
    const cashAmt = assets.filter(a=>(a.leverage!=null?a.leverage:1)===0)
                          .reduce((s,a)=>s+a.current, 0);
    const totalCurExpH = assets.reduce((s,a)=>s+(a.current*(a.leverage!=null?a.leverage:1)),0);
    const totalTgtExpH = assets.reduce((s,a)=>{
      const lev = a.leverage!=null?a.leverage:1;
      return s + (afterExp * assetEffectivePct(a)/100) * lev;
    },0);
    const totalTgtExpPct = afterExp>0 ? totalTgtExpH/afterExp*100 : 0;
    const barW   = Math.min(totalTgtExpPct, 200);
    const expClr = totalTgtExpPct>120?'var(--red)':totalTgtExpPct>100?'var(--gold)':'var(--green)';
    const expBg  = totalTgtExpPct>120?'rgba(224,85,85,.05)':totalTgtExpPct>100?'rgba(201,168,76,.05)':'rgba(76,175,130,.04)';
    const expBdr = totalTgtExpPct>120?'rgba(224,85,85,.35)':totalTgtExpPct>100?'rgba(201,168,76,.35)':'rgba(76,175,130,.25)';

    // ── 偏移監測顯示（兩層，相對偏離）──
    var devClr = function(v){ var x=Math.abs(v); return x>=30?'var(--red)':x>=15?'var(--gold)':'#5b9bd5'; };
    var devBg  = function(v){ var x=Math.abs(v); return x>=30?'rgba(224,85,85,.1)':x>=15?'rgba(201,168,76,.1)':'rgba(91,155,213,.1)'; };
    var devBdr = function(v){ var x=Math.abs(v); return x>=30?'rgba(224,85,85,.3)':x>=15?'rgba(201,168,76,.25)':'rgba(91,155,213,.25)'; };

    // 第一層：台股 : 美股

function refreshDonut(){
  const svg = document.getElementById('donutSvg');
  const legend = document.getElementById('donutLegend');
  const total = totalCurrent();
  const r=15.5,cx=18,cy=18,circ=2*Math.PI*r;
  // Small gap between segments (in circumference units)
  const GAP = circ * 0.012;
  let offset=0,segH='',legH='',defsH='';
  // Count segments with non-zero pct for gap logic
  const segs = assets.map((a,i)=>({a,i,pct: total>0?a.current/total:assetEffectivePct(a)/100})).filter(s=>s.pct>0.0001);
  segs.forEach(({a,i,pct})=>{
    const color=colorFor(i);
    const light=lightenHex(color, 0.28);
    const gid='grad'+i;
    // Gradient per segment
    defsH+=`<linearGradient id="${gid}" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="${light}"/>
      <stop offset="100%" stop-color="${color}"/>
    </linearGradient>`;
    const seg=pct*circ;
    const visible=Math.max(0, seg - GAP);
    segH+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="url(#${gid})"
      stroke-width="4" stroke-linecap="round"
      stroke-dasharray="${visible.toFixed(2)} ${(circ-visible).toFixed(2)}"
      stroke-dashoffset="${(-offset*circ).toFixed(2)}" />`;
    offset+=pct;
    const disp=total>0?(a.current/total*100).toFixed(1):assetEffectivePct(a).toFixed(0);
    legH+=`<div class="legend-item">
      <div class="legend-dot" style="background:${color};color:${color}"></div>
      <span class="legend-ticker">${a.ticker}</span>
      <span class="legend-pct">${disp}%</span>
    </div>`;
  });
  svg.innerHTML=`<defs>${defsH}</defs>`+segH;
  legend.innerHTML=legH;
  // Center total value
  const cv=document.getElementById('donutCenterValue');
  if(cv) cv.textContent='$'+fmt(total);
}

// Lighten a hex color toward white by t (0..1)
function lightenHex(hex, t){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const lr=Math.round(r+(255-r)*t), lg=Math.round(g+(255-g)*t), lb=Math.round(b+(255-b)*t);
  return '#'+[lr,lg,lb].map(x=>x.toString(16).padStart(2,'0')).join('');
}

// ── Refresh Rebalance ─────────────────────────────────────────────────────────
function refreshRebalance(){
  try {
  const rawW = withdraw();
  const w = Math.min(rawW, totalCurrent());
  const after = Math.max(0, totalCurrent() - w);
  let totalBuy=0, totalSell=0;

  // Guard: no assets
  if(!assets.length || !groups.length){
    ['layer1Cards','layer2Cards'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.innerHTML = '<div style="color:var(--muted);text-align:center;padding:20px;font-size:12px">請先在持倉頁新增資產</div>';
    });
    return;
  }


  // Compute targets
  const actionMap = {};
  assets.forEach(a=>{
    const effPct = assetEffectivePct(a);
    const target = Math.round(after * effPct / 100);
    const diff = target - a.current;
    if(diff>0) totalBuy+=diff; else totalSell+=Math.abs(diff);
    actionMap[a.id] = {target, diff};
  });

  // Summary
  const curTotal = totalCurrent(); // current holdings total (pre-withdraw)
  const curExp = assets.reduce((s,a)=>s+a.current*(a.leverage!=null?a.leverage:1),0);
  // curExpPct uses current total (not after) — apples-to-apples with current holdings
  const curExpPct = curTotal>0?(curExp/curTotal*100):0;
  const tgtExp = assets.reduce((s,a)=>{
    const lev=a.leverage!=null?a.leverage:1;
    return s+actionMap[a.id].target*lev;
  },0);
  // tgtExpPct uses after (post-withdraw) — apples-to-apples with target amounts
  const tgtExpPct = after>0?(tgtExp/after*100):0;
  const curExpColor = curExpPct>120?'var(--red)':curExpPct>100?'var(--gold)':'var(--green)';
  const tgtExpColor = tgtExpPct>120?'var(--red)':tgtExpPct>100?'var(--gold)':'var(--green)';
  document.getElementById('summaryGrid').innerHTML=`
    <div class="summary-card"><div class="summary-card-label">提領後總資產</div><div class="summary-card-value">$${fmt(after)}</div></div>
    <div class="summary-card"><div class="summary-card-label">提領金額</div><div class="summary-card-value ${w>0?'negative':''}">$${fmt(w)}</div></div>
    <div class="summary-card"><div class="summary-card-label">需賣出</div><div class="summary-card-value negative">$${fmt(totalSell)}</div></div>
    <div class="summary-card"><div class="summary-card-label">需買入</div><div class="summary-card-value positive">$${fmt(totalBuy)}</div></div>
    <div class="summary-card"><div class="summary-card-label">現在曝險</div><div class="summary-card-value" style="color:${curExpColor}">${curExpPct.toFixed(1)}%</div></div>
    <div class="summary-card"><div class="summary-card-label">全部到位後曝險</div><div class="summary-card-value" style="color:${tgtExpColor}">${tgtExpPct.toFixed(1)}%</div></div>`;

  // Layer 1: Group rebalance
  let l1Html = '';
  groups.forEach(g=>{
    const gCur = assetsInGroup(g.id).reduce((s,a)=>s+a.current,0);
    // Use sum of individual asset targets (which use normalized innerPct via assetEffectivePct)
    // This ensures Layer1 and Layer2 targets are consistent
    const gTgt = assetsInGroup(g.id).reduce((s,a)=>s+Math.round(after*assetEffectivePct(a)/100),0);
    const gDiff = gTgt - gCur;
    const color = groupColor(g.id);
    l1Html += `<div class="action-card" style="border-color:${color}44;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="flex:1;min-width:0">
          <div style="font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:${color};line-height:1.4">${g.name} 群組</div>
          <div style="margin-top:5px;line-height:1.4">
            <span style="font-size:10px;color:var(--muted)">目標 </span>
            <span style="font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:var(--text)">${g.pct}%</span>
            <span style="font-size:11px;color:var(--muted)"> → $${fmt(gTgt)}</span>
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0;padding-left:8px">
          <div style="font-family:'Space Mono',monospace;font-size:16px;font-weight:700;line-height:1.4;color:${gDiff>0?'var(--green)':gDiff<0?'var(--red)':'var(--muted)'}">${gDiff>0?'+':gDiff<0?'−':''}$${fmt(Math.abs(gDiff))}</div>
          <div style="margin-top:5px;line-height:1.4"><span style="font-size:10px;color:var(--muted)">現在 </span><span style="font-family:'Space Mono',monospace;font-size:12px;color:var(--text)">$${fmt(gCur)}</span></div>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('layer1Cards').innerHTML = l1Html;

  // Layer 2: Per-group inner rebalance
  let l2Html = '';
  groups.forEach(g=>{
    const color = groupColor(g.id);
    // Use same basis as actionMap for consistency
    const gTgt = assetsInGroup(g.id).reduce((s,a)=>s+Math.round(after*assetEffectivePct(a)/100),0);
    const groupAssets = assetsInGroup(g.id);

    let rowsHtml = '';
    groupAssets.forEach(a=>{
      if(!actionMap[a.id]) return; // skip if not in map
      const {target,diff} = actionMap[a.id];
      const aColor = colorFor(assets.findIndex(x=>x.id===a.id));

      // ── Shares calculation ──────────────────────────────
      let sharesHtml = '';
      if(diff !== 0){
        const g_rb = groups.find(x=>x.id===a.groupId);
        const isUSD_rb = g_rb && g_rb.currency==='USD';
        if(a.lastPrice && a.lastPrice > 0){
          const priceInTWD = isUSD_rb ? a.lastPrice * (exchangeRate||32) : a.lastPrice;
          const sharesAmt = Math.abs(diff) / priceInTWD;
          const sharesDisplay = sharesAmt >= 10
            ? Math.round(sharesAmt).toLocaleString()
            : sharesAmt >= 1
              ? sharesAmt.toFixed(1)
              : sharesAmt.toFixed(3);
          const priceDisplay = isUSD_rb
            ? 'USD $'+a.lastPrice.toFixed(2)
            : 'NT$ '+a.lastPrice.toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2});
          const actionWord = diff>0 ? '買入' : '賣出';
          const clr = diff>0 ? 'var(--green)' : 'var(--red)';
          sharesHtml = `<div style="font-family:'Space Mono',monospace;font-size:11px;line-height:1.5">
            <span style="color:var(--muted)">約</span>
            <span style="color:${clr};font-weight:700">${actionWord} </span>
            <span style="color:${clr};font-weight:700;font-size:14px">${sharesDisplay}</span>
            <span style="color:${clr};font-weight:700"> 股</span>
            <span style="color:var(--muted)"> @ ${priceDisplay}</span>
          </div>`;
        } else {
          sharesHtml = `<div style="font-size:10px;color:var(--muted);line-height:1.5;opacity:.45">
            輸入股價可顯示股數
          </div>`;
        }
      }

      rowsHtml += `<div style="padding:12px 0;border-bottom:1px solid var(--border)">
        <!-- Line 1: ticker + % (left) ... 買賣金額 (right) -->
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
          <div class="action-ticker ${diff>0?'buy':diff<0?'sell':'hold'}">${diff>0?'↑':diff<0?'↓':'—'} ${a.ticker} <span style="font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--muted)">${Math.round(a.innerPct)}%</span></div>
          ${(()=>{
            const g_rb2 = groups.find(x=>x.id===a.groupId);
            const isUSD_rb2 = g_rb2 && g_rb2.currency==='USD';
            const clr2 = diff>0?'var(--green)':diff<0?'var(--red)':'var(--muted)';
            const sign2 = diff>0?'+':diff<0?'−':'';
            const word = diff>0?'買':diff<0?'賣':'';
            if(isUSD_rb2 && a.lastPrice){
              const diffUSD = Math.abs(diff)/(exchangeRate||32);
              return '<div style="text-align:right;flex-shrink:0;padding-left:10px">'
                +'<div class="action-amount" style="color:'+clr2+'">'+sign2+'$'+Math.round(diffUSD).toLocaleString('en-US')+' <span style="font-size:9px;opacity:.6">USD</span></div>'
                +'<div style="font-family:\'Space Mono\',monospace;font-size:11px;color:'+clr2+';opacity:.65;margin-top:2px">'+sign2+'NT$'+fmt(Math.abs(diff))+'</div>'
                +'</div>';
            }
            return '<div class="action-amount '+(diff>0?'buy':diff<0?'sell':'hold')+'" style="flex-shrink:0;padding-left:10px">'+sign2+'$'+fmt(Math.abs(diff))+'</div>';
          })()}
        </div>
        <!-- Line 2: 現在 → 再平衡後 (full width, no truncation) -->
        <div style="line-height:1.5;margin-bottom:2px">
          <span style="font-size:11px;color:var(--muted)">現在 </span>
          <span style="font-family:'Space Mono',monospace;font-size:12px;color:var(--text)">$${fmt(a.current)}</span>
          <span style="font-size:11px;color:var(--muted)"> → 再平衡後 </span>
          <span style="font-family:'Space Mono',monospace;font-size:12px;color:var(--gold2)">$${fmt(target)}</span>
        </div>
        ${sharesHtml}
      </div>`;
    });

    l2Html += `<div class="group-rebal" style="border:1px solid ${color}44">
      <div class="group-rebal-header">
        <span class="group-rebal-title" style="color:${color}">${g.name} 群組內部</span>
        <span style="font-family:'Space Mono',monospace;font-size:11px;color:var(--muted)">目標 $${fmt(gTgt)}</span>
      </div>
      <div class="group-rebal-body">${rowsHtml}</div>
    </div>`;
  });
  document.getElementById('layer2Cards').innerHTML = l2Html;
  } catch(e){ console.error('refreshRebalance error:',e); }
}

// ── Refresh Returns ───────────────────────────────────────────────────────────
function refreshReturns(){
  const rawW = withdraw();
  const w = Math.min(rawW, totalCurrent());
  const after = Math.max(0, totalCurrent() - w);
  let totalP=0, wRate=0, rows='';
  const retTotalExp = assets.reduce((s,a)=>{
    const lev=a.leverage!=null?a.leverage:1;
    return s+(after*assetEffectivePct(a)/100)*lev;
  },0);

  assets.forEach((a,i)=>{
    const effPct = assetEffectivePct(a);
    const tgt = after*effPct/100;
    const profit = Math.round(tgt*a.rate/100);
    const lev = a.leverage!=null?a.leverage:1;
    const aExp = tgt*lev;
    const aExpPct = after>0?(aExp/after*100):0;
    const expLabel = lev===0?'現金':aExpPct.toFixed(1)+'%';
    const expClr = lev===0?'var(--muted)':lev>1?'var(--red)':'var(--gold2)';

    rows+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:10px 0;border-bottom:1px solid var(--border);align-items:center">

      <div style="text-align:center">
        <div style="font-family:'Space Mono',monospace;font-size:12px;color:${expClr};font-weight:700">${expLabel}</div>
        <div style="font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);margin-top:2px">${a.rate}%</div>

  document.getElementById('returnRows').innerHTML=rows;
  const retExpPctVal = after>0?(retTotalExp/after*100):0;

  if(retExpEl){ retExpEl.textContent=retExpPctVal.toFixed(1)+'%';
    retExpEl.style.color=retExpPctVal>120?'var(--red)':retExpPctVal>100?'var(--gold)':'var(--green)'; }
  if(retExpAmtEl) retExpAmtEl.textContent='$'+fmt(retTotalExp);
  // Normalize wRate: if group pcts don't sum to 100, scale accordingly
  const totalEffPct = assets.reduce((s,a)=>s+assetEffectivePct(a),0);
  const wRateNorm = totalEffPct > 0 ? wRate / totalEffPct * 100 : wRate;
  document.getElementById('weightedRate').textContent=wRateNorm.toFixed(1)+'%';
  document.getElementById('totalProfit').textContent='$'+fmt(totalP);
}

function calcPortfolioDD(ddMap){
  const w=withdraw(); const after=totalCurrent()-w;
  let portDD=0;
  assets.forEach(a=>{
    const assetDD=ddMap&&a.ticker?ddMap[a.ticker]:null;
    if(assetDD==null) return;
    // dd values already reflect actual ETF return (including leverage effect)
    // do NOT multiply by leverage again
    portDD+=(assetEffectivePct(a)/100)*assetDD;
  });
  return portDD;
}

// ── Add / Remove ──────────────────────────────────────────────────────────────
function addAsset(){
  const ticker   = document.getElementById('newTicker').value.trim().toUpperCase();
  const name     = document.getElementById('newName').value.trim();
  const groupSel = document.getElementById('newGroup');
  const gid      = Number(groupSel.value);
  const current  = Number(document.getElementById('newCurrent').value)||0;
  const innerPct = Number(document.getElementById('newPct').value)||0;
  const levRaw   = document.getElementById('newLeverage').value.trim();
  const leverage = levRaw!==''?Number(levRaw):1;
  const rate     = Number(document.getElementById('newRate').value)||0;

  if(!ticker){ alert('請輸入代號'); document.getElementById('newTicker').focus(); return; }

  const doAdd = ()=>{
    const a = makeAsset(gid, ticker, name, innerPct, current, rate, leverage);
    assets.push(a);
    // Re-normalize so all assets in group sum to 100%
    normalizeGroupPcts(gid);
    buildGroupCards();
    buildReturnCards();
    updateGroupSelect();
    ['newTicker','newName','newCurrent','newPct','newLeverage','newRate'].forEach(id=>{
      document.getElementById(id).value='';
    });
    updateCalc();
  };

  if(innerPct===0){
    customConfirm({
      title:'群組內比例為 0',
      message:'這個資產的群組內比例是 0%，再平衡時不會分配資金。確定要加入嗎？',
      confirmText:'仍要加入',
      onConfirm: doAdd
    });
  } else {
    doAdd();
  }
}

// Re-normalize innerPcts of a group to sum exactly to 100
function normalizeGroupPcts(gid){
  const ga = assets.filter(a=>a.groupId===gid);
  const sum = ga.reduce((s,a)=>s+a.innerPct, 0);
  if(sum <= 0){
    // All zero: distribute evenly
    ga.forEach(a=>{ a.innerPct = Math.round(100/ga.length); });
    // Fix rounding so last gets remainder
    const s2 = ga.reduce((s,a)=>s+a.innerPct, 0);
    if(ga.length>0) ga[ga.length-1].innerPct += (100-s2);
  } else {
    // Scale proportionally
    let allocated = 0;
    ga.forEach((a,i)=>{
      if(i===ga.length-1){
        a.innerPct = Math.max(0, 100-allocated);
      } else {
        a.innerPct = Math.max(0, Math.round(a.innerPct/sum*100));
        allocated += a.innerPct;
      }
    });
  }
}

function removeAsset(id){
  const idx=assetIndex(id); if(idx<0) return;
  if(assets.length<=1){ alert('至少保留一個資產'); return; }
  const rmGroupId = assets[idx].groupId;
  assets.splice(idx,1);
  // Re-normalize remaining assets so they sum to 100%
  if(assets.filter(a=>a.groupId===rmGroupId).length > 0){
    normalizeGroupPcts(rmGroupId);
  }
  buildGroupCards();
  buildReturnCards();
  updateCalc();
}

  const names=['overview','holdings','rebalance','dipbuy','returns','risk'];

  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='tab-'+name));
  if(name==='risk') renderRisk();
  if(name==='dipbuy') renderDipBuy();

  if(shell) shell.scrollTop = 0;

function autoFixGroupSum(){
  // Normalize all groups to sum to 100%
  const total = groups.reduce((s,g)=>s+g.pct, 0);
  if(total === 0){
    const each = Math.round(100/groups.length);
    groups.forEach(g=>{ g.pct = each; });
  } else {
    let remaining = 100;
    groups.forEach((g, i)=>{
      if(i === groups.length-1){
        g.pct = remaining; // last group gets remainder
      } else {
        g.pct = Math.round(g.pct/total*100);
        remaining -= g.pct;
      }
    });
  }
  buildGroupCards();
  updateCalc();
}

  return 'portfolio_v2_' + (acct||currentAccount);

  return localStorage.getItem('acctName_'+acct) || DEFAULT_NAMES[acct];

function loadData(){
  try {
    const raw = localStorage.getItem(accountStoreKey());
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s.assets||!s.assets.length) return false;
    groups = s.groups||groups;
    assets = s.assets;
    uid = s.uid||Math.max(...assets.map(a=>a.id),0);
    gid = s.gid||Math.max(...groups.map(g=>g.id),0);
    document.getElementById('withdrawInput').value = s.withdraw||0;
    // Migrate: fill missing fields
    assets.forEach(a=>{
      if(a.shares==null) a.shares=0;
      if(a.costBasis==null) a.costBasis=0;
      if(a.lastPrice==null) a.lastPrice=null;
      if(a.lastPriceAt==null) a.lastPriceAt=null;
    });
    groups.forEach(g=>{
      if(!g.currency){
        g.currency=(g.name.includes('美')||g.name.includes('US'))?'USD':'TWD';
      }
    });
    const savedRate = s.exchangeRate||localStorage.getItem('exchangeRate');
    if(savedRate) exchangeRate = Number(savedRate)||32;
    dipBuy = s.dipBuy || defaultDipBuy();
    return s.savedAt;
  } catch(e){ return false; }
}

function getYahooTicker(ticker){
  const map = {'00631L':'00631L.TW','0050':'0050.TW','006208':'006208.TW',

  if(map[ticker]) return map[ticker];

function applyPrice(id, price, quoteTime){
  const idx = assetIndex(id); if(idx<0) return;
  assets[idx].lastPrice = price;
  assets[idx].lastPriceAt = Date.now();
  assets[idx].quoteAt = quoteTime ? quoteTime*1000 : null;
  const a = assets[idx];
  const g = groups.find(x=>x.id===a.groupId);
  const isUSD = g && g.currency==='USD';
  if((a.shares||0) > 0){
    assets[idx].current = isUSD
      ? Math.round(a.shares * price * (exchangeRate||32))
      : Math.round(a.shares * price);
    const curEl = document.getElementById('cur-'+id);
    if(curEl && curEl!==document.activeElement)
      curEl.value = isUSD ? (assets[idx].current/(exchangeRate||32)).toFixed(0) : assets[idx].current;
    const twdEl = document.getElementById('twd-'+id);
    if(twdEl) twdEl.textContent='≈ NT$ '+assets[idx].current.toLocaleString('zh-TW');
  }
  updatePriceDisplay(id);
  updateCalc(); saveData();
}

async function tryAutoFetch(id){
  const btn = document.getElementById('autoFetchBtn');
  const idx = assetIndex(id); if(idx<0) return;
  const a = assets[idx];
  const sym = getYahooTicker(a.ticker);
  const endpoints = [
    'https://query1.finance.yahoo.com/v8/finance/chart/'+sym+'?interval=1d&range=1d',
    'https://query2.finance.yahoo.com/v8/finance/chart/'+sym+'?interval=1d&range=1d',
  ];
  const proxies = ['', 'https://corsproxy.io/?', 'https://api.allorigins.win/get?url='];
  let found = null, foundT = null;
  outer: for(const ep of endpoints){
    for(const px of proxies){
      try {
        const bust2='&_t='+Date.now(); const ep2b=ep+(ep.includes('?')?bust2:bust2.replace('&','?')); const url = px ? px+encodeURIComponent(ep2b) : ep2b;
        const res = await fetch(url, {signal:AbortSignal.timeout(6000), cache:'no-store'});
        const raw = await res.json();
        const body = raw.contents ? JSON.parse(raw.contents) : raw;
        const p = body?.chart?.result?.[0]?.meta?.regularMarketPrice;
        if(p){ found=p; foundT=body?.chart?.result?.[0]?.meta?.regularMarketTime||null; break outer; }
      } catch(e){}
    }
  }
  if(found){ applyPrice(id, found, foundT); }
  else { alert('自動抓取失敗，請手動輸入'); showPriceModal(id); }
}

  if(ms <= 0){ el.textContent = '更新中…'; }
  else { el.textContent = '下次更新 '+mins+':'+String(secs).padStart(2,'0'); }

      const s = JSON.parse(e.target.result);
      if(!s.assets||!s.assets.length){ alert('檔案格式錯誤'); return; }
      const importedGroupIds = new Set((s.groups||[]).map(g=>g.id));
      const orphaned = s.assets.filter(a=>!importedGroupIds.has(a.groupId));
      const doLoad = ()=>{
        groups=s.groups||groups; assets=s.assets;
        uid=s.uid||Math.max(...assets.map(a=>a.id),0);
        gid=s.gid||Math.max(...groups.map(g=>g.id),0);

        localStorage.setItem(accountStoreKey(),JSON.stringify({...s,savedAt:Date.now()}));
        buildGroupCards(); buildReturnCards(); updateGroupSelect(); updateCalc();
        const el=document.getElementById('saveStatus');
        if(el){ el.textContent='✓ 匯入成功'; el.style.opacity='1';
          clearTimeout(el._t); el._t=setTimeout(()=>{ el.style.opacity='0.4'; },3000); }
      };
      const confirmLoad = ()=>{
        customConfirm({
          title:'確定要匯入嗎？',
          message:'載入這份備份後，目前的資料將被覆蓋且無法復原。',
          confirmText:'確定匯入',
          confirmColor:'var(--green)',
          onConfirm: doLoad
        });
      };
      if(orphaned.length>0){
        customConfirm({
          title:'部分資產找不到群組',
          message:'有 '+orphaned.length+' 個資產找不到對應群組，會被分配到第一個群組。確定要繼續嗎？',
          confirmText:'繼續',
          onConfirm: ()=>{
            const firstGid = s.groups[0].id;
            s.assets.forEach(a=>{ if(!importedGroupIds.has(a.groupId)) a.groupId=firstGid; });
            confirmLoad();
          }
        });
      } else { confirmLoad(); }
    } catch(err){ alert('檔案格式錯誤：'+err.message); }
  };
  reader.readAsText(file);
  event.target.value='';
}


// ── Slider fills ──────────────────────────────────────────────────────────────
function updateSliderFill(slider){
  if(!slider) return;
  const min=parseFloat(slider.min)||0, max=parseFloat(slider.max)||100;
  const val=parseFloat(slider.value)||0;
  const ratio=(max>min)?(val-min)/(max-min):0;
  const thumbW=20, trackW=slider.offsetWidth||300;
  const centerPx=(thumbW/2)+ratio*(trackW-thumbW);
  slider.style.setProperty('--val',(centerPx/trackW*100).toFixed(2)+'%');
}
function initSliderFills(){
  document.querySelectorAll('input[type=range]').forEach(updateSliderFill);
}
document.addEventListener('input',e=>{
  if(e.target&&e.target.type==='range') updateSliderFill(e.target);
});

// ── Layout ────────────────────────────────────────────────────────────────────
// 版面補償（兩種模式共用一套機制）：
// 手機(<768px)：header sticky、tabs sticky —— 量 header 實際高度寫進 --hdr-h，
//   tabs 黏在 header 正下方（取代舊的寫死 76px，header 高度會隨雲端狀態文字變動）。
// 桌面(>=768px)：.fixed-top 整塊 position:fixed 脫離文流 —— 內容區必須墊
//   paddingTop = fixed-top 實際高度，否則頁面頂端會被表頭蓋住（切字）。
function adjustContentPadding(){
  const fixed=document.querySelector('.fixed-top');
  const shell=document.querySelector('.app-shell');
  const header=document.querySelector('.header');
  if(header) document.documentElement.style.setProperty('--hdr-h', header.offsetHeight+'px');
  if(fixed&&shell){
    const isFixed = getComputedStyle(fixed).position==='fixed';
    shell.style.paddingTop = isFixed ? fixed.offsetHeight+'px' : '';
  }
  fitTotalValue();
}
// 總資產數字自動縮字：以「完整顯示」為最高原則，空間不足時逐級縮小字級（下限 13px），永不截斷
function fitTotalValue(){
  const el = document.getElementById('totalDisplay');
  if(!el || !el.parentElement) return;
  el.style.fontSize = '';                              // 先還原成 CSS 預設（手機 26 / 桌面 30）
  const row = el.parentElement;                        // 表頭那一列（數字＋右側按鈕欄）
  let size = parseFloat(getComputedStyle(el).fontSize) || 26;
  let guard = 18;
  while(row.scrollWidth > row.clientWidth + 1 && size > 13 && guard-- > 0){
    size -= 1;
    el.style.fontSize = size + 'px';
  }
}
// 重算時機：載入、視窗大小/方向改變、網頁字型載入完成、
// 表頭高度變動（雲端狀態文字出現、帳戶改名、按鈕換行）由 ResizeObserver 自動接手
window.addEventListener('resize', adjustContentPadding);
window.addEventListener('orientationchange', adjustContentPadding);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(adjustContentPadding);
if(typeof ResizeObserver!=='undefined'){
  const _layoutRO=new ResizeObserver(adjustContentPadding);
  const _ft=document.querySelector('.fixed-top'); if(_ft) _layoutRO.observe(_ft);
  const _hd=document.querySelector('.header');    if(_hd) _layoutRO.observe(_hd);
}
adjustContentPadding();

// ── Group mini exposure refresh ────────────────────────────────────────────────
function refreshGroupMini(){
  groups.forEach(g=>{
    const el=document.getElementById('gmini-'+g.id);
    if(!el) return;
    const ga=assetsInGroup(g.id);
    const total=totalCurrent();
    const after=Math.max(0,total-withdraw());
    // 總曝險：全帳戶所有資產（不分群組）的曝險合計 ÷ 總資產
    const curExp=assets.reduce((s,a)=>s+a.current*(a.leverage!=null?a.leverage:1),0);
    const curExpPct=total>0?(curExp/total*100).toFixed(1):0;
    const tgtExp=assets.reduce((s,a)=>{
      const effPct=assetEffectivePct(a);
      const lev=a.leverage!=null?a.leverage:1;
      return s+(after*effPct/100)*lev;
    },0);
    const tgtExpPct=after>0?(tgtExp/after*100).toFixed(1):0;
    const innerSum = ga.reduce((s,x)=>s+x.innerPct,0)||1;
    // Legend columns: glowing dot + ticker + pct
    const cols=ga.map((a,i)=>{
      const pct=(a.innerPct/innerSum*100).toFixed(0);
      const c=colorFor(assets.findIndex(x=>x.id===a.id));
      return '<div style="flex:1;text-align:center">'
        +'<div style="display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:3px">'
          +'<span style="width:8px;height:8px;border-radius:50%;background:'+c+';box-shadow:0 0 8px '+c+';display:inline-block"></span>'
          +'<span style="font-family:\'Space Mono\',monospace;font-size:10px;color:var(--text2);font-weight:700;letter-spacing:.5px">'+a.ticker+'</span>'
        +'</div>'
        +'<div style="font-family:\'Space Mono\',monospace;font-size:16px;font-weight:700;color:'+c+'">'+pct+'%</div></div>';
    }).join('');
    // Premium stacked proportion bar with gradient segments + gloss + thin gaps
    const segs = ga.map((a,i)=>{
      const w = (a.innerPct/innerSum*100).toFixed(2);
      const c = colorFor(assets.findIndex(x=>x.id===a.id));
      const ml = i>0 ? 'margin-left:2px;' : '';
      return '<div style="width:'+w+'%;'+ml+'height:100%;border-radius:3px;background:'+c+';'
        +'background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(0,0,0,.18));'
        +'box-shadow:inset 0 1px 0 rgba(255,255,255,.3)"></div>';
    }).join('');
    const bar = '<div style="display:flex;width:100%;height:14px;margin-bottom:16px">'+segs+'</div>';
    el.innerHTML='<div style="display:flex;gap:4px;justify-content:center;margin-bottom:12px">'+cols+'</div>'
      +bar
      +'<div style="display:flex;align-items:center;justify-content:center;gap:14px;text-align:center;background:rgba(76,175,130,.06);border:1px solid rgba(76,175,130,.18);border-radius:10px;padding:10px 16px">'
        +'<div><div style="font-size:9px;color:var(--muted);margin-bottom:3px;letter-spacing:1px">當前曝險</div>'
          +'<div style="font-family:\'Space Mono\',monospace;font-size:19px;font-weight:700;color:var(--text2)">'+curExpPct+'%</div></div>'
        +'<div style="color:var(--green);font-size:16px;font-weight:700">→</div>'
        +'<div><div style="font-size:9px;color:var(--muted);margin-bottom:3px;letter-spacing:1px">改後曝險</div>'
          +'<div style="font-family:\'Space Mono\',monospace;font-size:19px;font-weight:700;color:var(--green);text-shadow:0 0 10px rgba(76,175,130,.5)">'+tgtExpPct+'%</div></div>'
      +'</div>';
  });
}

// ── fetchOneAsset ──────────────────────────────────────────────────────────────
async function fetchOneAsset(id){
  const btn=document.getElementById('pricebtn-'+id);
  if(btn){ btn.textContent='⏳'; btn.disabled=true; }
  const idx=assetIndex(id); if(idx<0){ if(btn){btn.textContent='↻';btn.disabled=false;} return; }
  const a=assets[idx];
  const sym=getYahooTicker(a.ticker);
  const endpoints=['https://query1.finance.yahoo.com/v8/finance/chart/'+sym+'?interval=1d&range=1d',
                   'https://query2.finance.yahoo.com/v8/finance/chart/'+sym+'?interval=1d&range=1d'];
  const proxies=['','https://corsproxy.io/?','https://api.allorigins.win/get?url='];
  let found=null, foundT=null;
  outer: for(const ep of endpoints){
    for(const px of proxies){
      try{
        const bust='&_t='+Date.now(); const ep2=ep+(ep.includes('?')?bust:bust.replace('&','?')); const url=px?px+encodeURIComponent(ep2):ep2;
        const res=await fetch(url,{signal:AbortSignal.timeout(6000),cache:'no-store'});
        const raw=await res.json();
        const body=raw.contents?JSON.parse(raw.contents):raw;
        const p=body?.chart?.result?.[0]?.meta?.regularMarketPrice;
        if(p){found=p;foundT=body?.chart?.result?.[0]?.meta?.regularMarketTime||null;break outer;}
      }catch(e){}
    }
  }
  if(btn){btn.textContent='↻';btn.disabled=false;}
  if(found) applyPrice(id,found,foundT);
}

// 清本地：優先從雲端還原；雲端讀不到就不動作（避免預設值倒灌污染雲端）
async function doLocalReset(){
  const token = getGistToken();
  const gistId = getGistId();
  localStorage.removeItem(accountStoreKey());
  localStorage.removeItem('gh_gist_savedAt');
  if(!token || !gistId){ location.reload(); return; } // 無雲端 → 單純回預設(空白)
  showCloudStatus('⬇ 從雲端還原中…', 'var(--text2)');
  try {
    const res = await fetch('https://api.github.com/gists/'+gistId, {
      headers:{ Authorization:'Bearer '+token }, cache:'no-store',
      signal: AbortSignal.timeout(10000)
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const content = (await res.json()).files[GIST_FILENAME]?.content;
    if(!content) throw new Error('雲端無資料');
    const s = JSON.parse(content);
    if(applyCloudState(s)){
      localStorage.setItem('gh_gist_savedAt', String(s.savedAt||Date.now()));
      showCloudStatus('☁ 已從雲端還原 ✓', 'var(--green)');
    } else {
      showCloudStatus('⚠ 雲端沒有此帳戶資料', 'var(--gold)');
    }
  } catch(e){
    showCloudStatus('⚠ 還原失敗（未重置）：'+e.message, 'var(--red)');
  }
}

// ── Quick Rebalance hint (per-group) ─────────────────────────────────────────
// 群組內目標與偏離（快速再平衡與總覽偏移監測共用同一來源）：
// ・配對所在群組：直接解「目標曝險」——目前組大小下配對怎麼分，全帳戶曝險才 = targetExp
// ・其他群組（曝險中性）：組目前總額 × 內部占比
function groupInnerTargets(gid){
  const ga = assetsInGroup(gid);
  if(!ga.length) return null;
  const innerSum = ga.reduce((s,a)=>s+a.innerPct,0)||1;
  const gCurTotal = ga.reduce((s,a)=>s+a.current,0);
  if(gCurTotal<=0) return null;
  const _qLev = dipLevAsset(), _qCash = dipCashAsset(_qLev);
  const isPairGroup = _qLev && _qCash && _qLev.groupId===gid;
  let pairTargets = null;
  if(isPairGroup && typeof dipBuy!=='undefined' && dipBuy.targetExp!=null){
    const tot = totalCurrent();
    const dlv = (_qLev.leverage!=null?_qLev.leverage:1)-(_qCash.leverage!=null?_qCash.leverage:0);
    if(tot>0 && dlv>0){
      let fixedExp = 0;
      assets.forEach(x=>{
        if(x===_qLev||x===_qCash) return;
        const xl = (x.leverage!=null?x.leverage:1);
        if(x.groupId===gid) fixedExp += Math.round(gCurTotal*(x.innerPct/innerSum)) * xl;
        else fixedExp += x.current * xl;
      });
      const othersInGroup = ga.filter(x=>x!==_qLev&&x!==_qCash)
        .reduce((s,x)=>s+Math.round(gCurTotal*(x.innerPct/innerSum)),0);
      const pairBudget = gCurTotal - othersInGroup;
      const cashL = (_qCash.leverage!=null?_qCash.leverage:0);
      const needExpAmt = dipBuy.targetExp/100*tot;
      let levTgt = Math.round((needExpAmt - fixedExp - pairBudget*cashL)/dlv);
      levTgt = Math.min(Math.max(levTgt, 0), pairBudget);
      pairTargets = {}; pairTargets[_qLev.id]=levTgt; pairTargets[_qCash.id]=pairBudget-levTgt;
    }
  }
  const deviations = ga.map(a=>{
    const tgtAmt = (pairTargets && pairTargets[a.id]!=null)
      ? pairTargets[a.id]
      : Math.round(gCurTotal * (a.innerPct/innerSum));
    const diff = tgtAmt - a.current;
    const tgtInner = tgtAmt/gCurTotal*100;
    const actInner = a.current/gCurTotal*100;
    const relDev = tgtInner>0 ? (actInner-tgtInner)/tgtInner*100 : 0;
    return {a, tgtAmt, diff, relDev};
  });
  return { deviations, gCurTotal, isPairGroup };
}

function renderQuickRebal(gid, after){
