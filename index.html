  if(!el) return;
  const g = groups.find(x=>x.id===gid);
  if(!g){ el.style.display='none'; return; }
  const ga = assetsInGroup(gid);
  if(!ga.length){ el.style.display='none'; return; }

  const _gt = groupInnerTargets(gid);
  if(!_gt){ el.style.display='none'; return; }
  const { deviations, gCurTotal, isPairGroup } = _gt;
  const innerSum = ga.reduce((s,a)=>s+a.innerPct,0)||1;

  const maxRelDev = Math.max(...deviations.map(d=>Math.abs(d.relDev)));

  const pctDev = maxRelDev.toFixed(1);
  const urgency = maxRelDev>=30?'var(--red)':maxRelDev>=15?'var(--gold)':'#5b9bd5';
  const urgBg   = maxRelDev>=30?'rgba(224,85,85,.08)':maxRelDev>=15?'rgba(201,168,76,.08)':'rgba(91,155,213,.08)';
  const urgBdr  = maxRelDev>=30?'rgba(224,85,85,.3)':maxRelDev>=15?'rgba(201,168,76,.3)':'rgba(91,155,213,.3)';
  const advice  = maxRelDev>=30?'⚠ 偏移達30%，建議盡快再平衡':maxRelDev>=15?'中度偏移，可擇機調整':'偏移輕微，暫可不調整';

  const sells = deviations.filter(d=>d.diff<0).sort((a,b)=>a.diff-b.diff);
  const buys  = deviations.filter(d=>d.diff>0).sort((a,b)=>b.diff-a.diff);

  // 執行後總曝險：本組各標的回到組內目標（以本組現總額為基），其他群組維持現狀
  const qrTot = totalCurrent();
  const qrOtherExp = assets.filter(a=>a.groupId!==gid).reduce((s,a)=>s+a.current*(a.leverage!=null?a.leverage:1),0);
  const qrGroupExpAfter = deviations.reduce((s,d)=>s+d.tgtAmt*((d.a.leverage!=null?d.a.leverage:1)),0);
  const qrExpAfter = qrTot>0 ? (qrOtherExp+qrGroupExpAfter)/qrTot*100 : 0;

    const isCash = (a.leverage!=null?a.leverage:1)===0;
    let amtHtml;

      amtHtml = '<div style="font-family:\'Space Mono\',monospace;font-size:13px;font-weight:700;color:'+clr+'">'+sign+'$'+Math.round(diffUSD).toLocaleString('en-US')+' <span style="font-size:9px;opacity:.6">USD</span></div>'

  let sellHtml='', buyHtml='';

      <div style="width:3px;align-self:stretch;min-height:16px;background:${urgency};border-radius:2px"></div>

// ── Fetch USD/TWD exchange rate ───────────────────────────────────────────────
async function fetchRate(){
  const sym = 'TWD=X'; // Yahoo Finance USD/TWD ticker
  const endpoints = [
    'https://query1.finance.yahoo.com/v8/finance/chart/'+sym+'?interval=1d&range=1d',
    'https://query2.finance.yahoo.com/v8/finance/chart/'+sym+'?interval=1d&range=1d',
  ];
  const proxies = ['', 'https://corsproxy.io/?', 'https://api.allorigins.win/get?url='];
  let found = null;
  outer: for(const ep of endpoints){
    for(const px of proxies){
      try{
        const bust = '&_t='+Date.now();
        const ep2 = ep + bust;
        const url = px ? px+encodeURIComponent(ep2) : ep2;
        const res = await fetch(url, {signal:AbortSignal.timeout(6000), cache:'no-store'});
        const raw = await res.json();
        const body = raw.contents ? JSON.parse(raw.contents) : raw;
        const p = body?.chart?.result?.[0]?.meta?.regularMarketPrice;
        if(p && p > 0){ found = p; break outer; }
      } catch(e){}
    }
  }
  if(found){
    exchangeRate = Math.round(found * 100) / 100; // round to 2 decimal places
    localStorage.setItem('exchangeRate', String(exchangeRate));
    // Update all rate inputs on screen
    document.querySelectorAll('[id^="rateInput-"]').forEach(inp=>{
      if(inp !== document.activeElement) inp.value = exchangeRate;
    });
  }
  return found;
}


// ── Find portfolio Gist by searching user's gists ────────────────────────────
// Always picks the OLDEST matching gist so all devices converge on the same one.
async function findPortfolioGist(token){
  try {
    const res = await fetch('https://api.github.com/gists?per_page=100', {
      headers: { Authorization:'Bearer '+token },
      cache:'no-store'
    });
    if(!res.ok) return null;
    const gists = await res.json();
    // Find ALL gists containing our portfolio file
    const matches = gists.filter(g => g.files && g.files[GIST_FILENAME]);
    if(!matches.length) return null;
    // Sort by updated date descending → pick the most recently updated (has latest data)
    matches.sort((a,b)=> new Date(b.updated_at) - new Date(a.updated_at));
    const canonical = matches[0];
    localStorage.setItem('gh_gist_id', canonical.id);
    return canonical.id;
  } catch(e){ return null; }
}

// ⏪ 時光機：讀取 Gist 版本歷史的前一版並還原（還原後會以新版本上傳，雲端歷史不會消失）
async function restorePreviousVersion(){
  const token = getGistToken();
  const gistId = getGistId();
  if(!token){ setupGistToken(); return; }
  if(!gistId){ showCloudStatus('⚠ 尚未連結雲端', 'var(--gold)'); return; }
  showCloudStatus('⏪ 讀取歷史版本…', 'var(--text2)');
  try {
    const res = await fetch('https://api.github.com/gists/'+gistId, {
      headers:{ Authorization:'Bearer '+token }, cache:'no-store',
      signal: AbortSignal.timeout(10000)
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const hist = data.history||[];
    if(hist.length < 2) throw new Error('沒有更早的版本');
    const prev = hist[1]; // [0]=目前版, [1]=前一版
    const res2 = await fetch(prev.url, {
      headers:{ Authorization:'Bearer '+token }, cache:'no-store',
      signal: AbortSignal.timeout(10000)
    });
    if(!res2.ok) throw new Error('HTTP '+res2.status);
    const content = (await res2.json()).files[GIST_FILENAME]?.content;
    if(!content) throw new Error('該版本無資料');
    const s = JSON.parse(content);
    const t = new Date(prev.committed_at);
    const ts = (t.getMonth()+1)+'/'+t.getDate()+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
    customConfirm({
      title:'⏪ 還原前一版',
      message:'還原到 '+ts+' 的版本？目前資料會被取代（還原後會成為新版本上傳，之後仍可再還原）。',
      confirmText:'還原',
      confirmColor:'var(--gold)',
      onConfirm: ()=>{
        if(applyCloudState(s)){
          saveData(); // 以還原後的資料排程上傳為最新版
          showCloudStatus('⏪ 已還原 '+ts+' 版本 ✓', 'var(--green)');
        } else {
          showCloudStatus('⚠ 該版本沒有此帳戶資料', 'var(--gold)');
        }
      }
    });
  } catch(e){
    showCloudStatus('⚠ 還原失敗：'+e.message, 'var(--red)');
  }
}

// Re-link to the canonical (oldest) gist — clears local id and re-resolves
async function relinkCloud(){
  const token = getGistToken();
  if(!token){ setupGistToken(); return; }
  showCloudStatus('🔗 重新連結中…', 'var(--text2)');
  localStorage.removeItem('gh_gist_id');
  const id = await findPortfolioGist(token);
  if(id){
    // Load the canonical gist's data immediately
    localStorage.removeItem('gh_gist_savedAt'); // force reload
    await loadFromGist();
  } else {
    showCloudStatus('⚠ 找不到雲端資料', 'var(--gold)');
  }
}

// 錨點=歷史高點(自動上移，可手改)；創新高時階梯重新武裝。
// 執行加碼=帳面移轉：正二現金 → 槓桿標的（金額、股數、成本基礎連動）。
function dipLevAsset(){ return assets.find(a=>(a.leverage!=null?a.leverage:1)>=2) || null; }
function dipCashAsset(lev){
  if(!lev) return null;
  return assets.find(a=>a.groupId===lev.groupId && (a.leverage!=null?a.leverage:1)===0) || null;
}

function dipMaintainAnchor(){
  const lev = dipLevAsset();
  if(!lev || !lev.lastPrice) return;
  if(!dipBuy.anchor){
    dipBuy.anchor = lev.lastPrice;           // 首次設錨：不動目標曝險
  } else if(lev.lastPrice > dipBuy.anchor){
    dipBuy.anchor = lev.lastPrice;
    dipBuy.tiers.forEach(t=>t.done=false);   // 創新高 → 重新武裝
    if(dipBuy.targetExp!=null && dipBuy.targetExp!==100){
      dipBuy.targetExp = 100;                // 目標曝險回歸基準（收割訊號）
      derivePairFromTargetExp();
      if(typeof showCloudStatus==='function') showCloudStatus('⚡ 創新高：階梯重新武裝，目標曝險回到 100%','var(--green)');
    }
  }
}

function dipSetAnchor(v){
  const n = parseFloat(v);
  if(n>0){ dipBuy.anchor = Math.round(n*100)/100; saveData(); renderDipBuy(true); }
}

// ── 手動抓歷史高點：上市以來「日收盤」最大值，錨點 = max(歷史收盤高, 現價) ──
// 只在按下按鈕時執行（無自動偵測、無模式切換）。失敗一律沿用舊錨點。
// 注意：抓高點「不會」重置已執行的階梯——發現更深的回檔≠價格收復新高，重置會導致重複掏子彈。
async function dipFetchHigh(){
  const lev = dipLevAsset();
  if(!lev){ showCloudStatus('⚠ 找不到槓桿標的', 'var(--gold)'); return; }
  const btn = document.getElementById('dipHighBtn');
  if(btn){ btn.textContent='⏳'; btn.disabled=true; }
  const sym = getYahooTicker(lev.ticker);
  // period1=0&period2=now 強制回傳「完整日線」；range=max 會被 Yahoo 對部分標的
  // 默默降成週/月線（dataGranularity 變 1wk/1mo），月收盤的最大值會低於真實日收盤高。
  const nowSec = Math.floor(Date.now()/1000);
  const endpoints = ['https://query1.finance.yahoo.com/v8/finance/chart/'+sym+'?interval=1d&period1=0&period2='+nowSec,
                     'https://query2.finance.yahoo.com/v8/finance/chart/'+sym+'?interval=1d&period1=0&period2='+nowSec];
  const proxies = ['','https://corsproxy.io/?','https://api.allorigins.win/get?url='];
  let maxV=-1, maxT=null, seriesLast=null, cnt=0;
  outer: for(const ep of endpoints){
    for(const px of proxies){
      try{
        const bust='&_t='+Date.now(); const ep2=ep+bust; const url=px?px+encodeURIComponent(ep2):ep2;
        const res=await fetch(url,{signal:AbortSignal.timeout(10000),cache:'no-store'});
        const raw=await res.json();
        const body=raw.contents?JSON.parse(raw.contents):raw;
        const r0=body?.chart?.result?.[0];
        const gran=r0?.meta?.dataGranularity;
        if(gran && gran!=='1d') continue;               // 被降成週/月線 → 拒收，換下一條通道
        const arr=(r0?.indicators?.quote?.[0]?.close)||(r0?.indicators?.adjclose?.[0]?.adjclose)||null;
        if(!arr || !arr.length) continue;
        const ts=r0?.timestamp||[];
        let mV=-1, mT=null, last=null, c=0;
        for(let i=0;i<arr.length;i++){
          const v=arr[i];
          if(typeof v==='number'&&isFinite(v)&&v>0){ c++; last=v; if(v>mV){ mV=v; mT=ts[i]||null; } }
        }
        if(c>0){ maxV=mV; maxT=mT; seriesLast=last; cnt=c; break outer; }
      }catch(e){}
    }
  }
  if(btn){ const b=document.getElementById('dipHighBtn'); if(b){ b.textContent='⟳'; b.disabled=false; } }
  if(maxV<=0){ showCloudStatus('⚠ 歷史「日線」抓取失敗，沿用原錨點', 'var(--gold)'); return; }
  // 合理性檢查：資料量須足夠；數列尾端須貼近現價（防抓錯標的/髒資料把錨點卡在假高點）
  if(cnt < 100){ showCloudStatus('⚠ 歷史資料不足，沿用原錨點', 'var(--gold)'); return; }
  if(lev.lastPrice && Math.abs(seriesLast-lev.lastPrice)/lev.lastPrice > 0.3){
    showCloudStatus('⚠ 歷史資料異常（與現價偏差過大），沿用原錨點', 'var(--gold)'); return;
  }
  const newAnchor = Math.round(Math.max(maxV, lev.lastPrice||0)*100)/100;
  dipBuy.anchor = newAnchor;
  saveData(); renderDipBuy(true);
  const dStr = maxT ? new Date(maxT*1000).toLocaleDateString('zh-TW') : '';
  showCloudStatus('✓ 錨點＝歷史收盤高 '+newAnchor.toFixed(2)+(dStr&&maxV>=(lev.lastPrice||0)?'（'+dStr+'）':'（現價）'), 'var(--green)');
}
function dipSetTier(i,k,v){
  const n = parseFloat(v); const t = dipBuy.tiers[i];
  if(!t) return;
  if(k==='pct'){ if(isFinite(n)&&n>0&&n<=100){ t.pct=Math.round(n*10)/10; saveData(); renderDipBuy(true); } return; }
  const max = k==='exp' ? 300 : 99;
  if(n>0 && n<=max){ t[k]=n; saveData(); renderDipBuy(true); }
}
function dipSetReserve(v){
  const n = Math.round(parseFloat(v));
  dipBuy.reserve = (isFinite(n) && n>0) ? n : 0;
  saveData(); renderDipBuy(true);
}

    el.innerHTML = '<div class="action-card" style="text-align:center;padding:28px;color:var(--muted);font-size:12px">尚無資產資料——到「持倉」頁輸入，或等待雲端同步。</div>';
    return;
  }

  // ── 偏移監測資料（與快速再平衡同一來源）──
  const layer1 = groups.map(g=>{
    const gTot = assetsInGroup(g.id).reduce((s,a)=>s+a.current,0);
    const curPctG = total>0 ? gTot/total*100 : 0;
    const relDev = g.pct>0 ? (curPctG-g.pct)/g.pct*100 : 0;
    return {g, curPctG, relDev};
  });
  const layer2 = groups.map(g=>{
    const gt = groupInnerTargets(g.id);
    return {g, devs: gt ? gt.deviations : []};
  });
  let worst = null;
  layer1.forEach(r=>{ if(!worst || Math.abs(r.relDev)>Math.abs(worst.v)) worst={v:r.relDev, txt:'第一層 '+r.g.name+' '+(r.relDev>=0?'+':'')+r.relDev.toFixed(1)+'%'}; });
  layer2.forEach(({g,devs})=>{ devs.forEach(d=>{ if(!worst || Math.abs(d.relDev)>Math.abs(worst.v)) worst={v:d.relDev, txt:'群組內 '+g.name+'・'+d.a.ticker+' '+(d.relDev>=0?'+':'')+d.relDev.toFixed(1)+'%'}; }); });
  const worstAbs = worst ? Math.abs(worst.v) : 0;

  // ── 警示橫幅 ──
  if(worstAbs >= 30){

    const pend = dipBuy.tiers.map((t,i)=>({t,i})).filter(x=>!x.t.done && dd!=null && dd>=x.t.dd && Math.round(_lAvail*(x.t.pct||0)/100)>0);

// ═══ 單一自由度架構：全系統只有一個目標——targetExp（目標總曝險%）═══════════
// 00631L:正二現金 的 innerPct 不再是使用者設定，而是由 targetExp 反推的「推導值」。
// 再平衡、加碼階梯、曝險控制器全部指向同一個終點，結構上不可能互相矛盾。

// 配對上下文：固定曝險（配對以外資產）、配對合計占比、可達曝險範圍（配置層級）
function dipPairContext(){
  const lev=dipLevAsset(), cash=dipCashAsset(lev);
  if(!lev||!cash) return null;
  const levL=(lev.leverage!=null?lev.leverage:1), cashL=(cash.leverage!=null?cash.leverage:0);
  const L=levL-cashL; if(L<=0) return null;
  let fixedExp=0, pairEff=0;
  assets.forEach(x=>{
    const e=assetEffectivePct(x), xl=(x.leverage!=null?x.leverage:1);
    if(x===lev||x===cash) pairEff+=e; else fixedExp+=e*xl;
  });
  return {lev,cash,levL,cashL,L,fixedExp,pairEff,
          minExp:fixedExp+pairEff*cashL, maxExp:fixedExp+pairEff*levL};
}

// 目標曝險 → 反推配對 innerPct（例：100%→50:50、120.4%→67:33）
function derivePairFromTargetExp(){
  if(typeof dipBuy==='undefined'||!dipBuy||dipBuy.targetExp==null) return;
  const c=dipPairContext(); if(!c||c.pairEff<=0) return;
  const eff=Math.min(Math.max(dipBuy.targetExp,c.minExp),c.maxExp);
  const effLev=(eff-c.fixedExp-c.pairEff*c.cashL)/c.L;
  const frac=Math.min(Math.max(effLev/c.pairEff,0),1);
  const pairSum=c.lev.innerPct+c.cash.innerPct;
  c.lev.innerPct=Math.round(pairSum*frac*100)/100;
  c.cash.innerPct=Math.round((pairSum-c.lev.innerPct)*100)/100;
  refreshPairSliderUI(c);
}

// 推導後同步滑桿顯示（滑桿為唯讀展示）
function refreshPairSliderUI(c){
  if(sliderRecentlyActive()) return;   // 拖動中：不奪回拉桿（放手 commit 會清旗標後重定位）
  c = c || dipPairContext(); if(!c) return;
  [c.lev,c.cash].forEach(a=>{
    const s=document.getElementById('pctSlider-'+a.id);
    if(s){ s.value=a.innerPct; if(typeof updateSliderFill==='function') updateSliderFill(s); }
    const b=document.getElementById('badge2-'+a.id);
    if(b) b.textContent=Math.round(a.innerPct)+'%';
  });
}

// 舊資料遷移：無 targetExp → 由現有配置無損換算；無 exp → 帶入預設 110/130/160
function ensureDipMigration(){
  if(typeof dipBuy==='undefined'||!dipBuy){ dipBuy=defaultDipBuy(); return; }
  if(!dipBuy.tiers||!dipBuy.tiers.length) dipBuy.tiers=defaultDipBuy().tiers;
  const defP=[15,35,50];
  dipBuy.tiers.forEach((t,i)=>{ if(t.pct==null) t.pct=(defP[i]!=null?defP[i]:35); });
  if(dipBuy.reserve==null) dipBuy.reserve=0;
  if(dipBuy.targetExp==null){
    const e=assets.reduce((s,x)=>s+assetEffectivePct(x)*(x.leverage!=null?x.leverage:1),0);
    dipBuy.targetExp=Math.round((e>0?e:100)*10)/10;
  }
}

// 使用者改目標曝險（唯一入口；含配置層級可達範圍夾限）
// 拉桿放手 → 換算曝險 → 寫入唯一自由度（拉桿是目標曝險的另一種輸入手勢）
function pairSliderCommit(id, val){
  _sliderTouch = 0;
  const c = dipPairContext(); if(!c) return;
  if(id!==c.lev.id && id!==c.cash.id) return;
  const pairSum = (c.lev.innerPct + c.cash.innerPct) || 100;
  const levShare = (id===c.lev.id) ? Number(val) : pairSum - Number(val);
  const frac = Math.min(Math.max(levShare/pairSum, 0), 1);
  const exp = c.fixedExp + c.pairEff*c.cashL + frac*c.pairEff*c.L;
  dipSetTargetExp(String(Math.round(exp)));   // 吸附整數曝險（與拖動預覽一致）
  if(typeof showCloudStatus==='function') showCloudStatus('🎯 目標曝險 → '+dipBuy.targetExp.toFixed(1)+'%（由拉桿設定）', 'var(--gold)');
}

function dipSetTargetExp(v){
  _sliderTouch = 0;
  const n=parseFloat(v);
  if(!isFinite(n)||n<=0){ renderDipBuy(true); renderOverview(true); return; }
  const c=dipPairContext();
  let t=Math.round(n*10)/10;
  if(c) t=Math.min(Math.max(t,Math.round(c.minExp*10)/10),Math.round(c.maxExp*10)/10);
  dipBuy.targetExp=t;
  derivePairFromTargetExp();
  updateCalc();
  renderDipBuy(true);
  renderOverview(true);
}

// ── 曝險控制器：目標曝險（唯一自由度）的操作台 ─────────────────────────────
// 目標持久化於 dipBuy.targetExp；配對 innerPct 由其推導；此處顯示現在→目標的移轉額。

function expCtrlCalc(lev, cash, avail){
  const tot = totalCurrent();
  const dlv = (lev.leverage!=null?lev.leverage:1) - (cash.leverage!=null?cash.leverage:0);
  if(tot<=0 || dlv<=0) return null;
  const curExp = assets.reduce((s,x)=>s+x.current*(x.leverage!=null?x.leverage:1),0);
  const curPct = curExp/tot*100;
  const minPct = (curExp - lev.current*dlv)/tot*100;   // 正二全數賣回現金
  const maxPct = (curExp + avail*dlv)/tot*100;         // 可動用現金全數投入（尊重保留線）
  let eff=null, clamped=false, amt=null, afterPct=null;
  if(dipBuy.targetExp!=null){
    eff = Math.min(Math.max(dipBuy.targetExp, minPct), maxPct);
    clamped = Math.abs(eff - dipBuy.targetExp) > 0.05;
    amt = Math.round((eff - curPct)/100 * tot / dlv);
    afterPct = (curExp + amt*dlv)/tot*100;
  }
  return {tot, dlv, curPct, minPct, maxPct, eff, clamped, amt, afterPct};
}

function expCtrlExec(){
  const lev = dipLevAsset(), cash = dipCashAsset(lev);
  if(!lev || !cash) return;
  const reserve = Math.max(0, dipBuy.reserve||0);
  const avail = Math.max(0, cash.current - reserve);
  const cc = expCtrlCalc(lev, cash, avail);
  if(!cc || cc.amt==null || Math.abs(cc.amt)<1) return;
  const buying = cc.amt > 0;
  const a = Math.abs(cc.amt);
  const newLev = lev.current + cc.amt, newCash = cash.current - cc.amt;
  const pair = newLev + newCash;
  const ratio = pair>0 ? Math.round(newLev/pair*100) : 0;
  const inCycle = dipBuy.tiers.some(t=>t.done);
  const warnLine = (!buying && inCycle)
    ? '<br><b style="color:var(--red)">⚠ 加碼週期進行中（有階梯已執行、尚未創新高）：調降曝險會抵銷已執行的加碼。</b>'
    : '';
  customConfirm({
    title:'🎯 調整總曝險至 '+cc.eff.toFixed(1)+'%',
    message:(buying
        ? '買入「'+lev.ticker+'」 <b style="color:var(--gold)">$'+fmt(a)+'</b>'+(fmtShares(a,lev.lastPrice)?'（'+fmtShares(a,lev.lastPrice)+'）':'')+'，從「'+cash.ticker+'」支付。'
        : '賣出「'+lev.ticker+'」 <b style="color:var(--gold)">$'+fmt(a)+'</b>'+(fmtShares(a,lev.lastPrice)?'（'+fmtShares(a,lev.lastPrice)+'）':'')+'，回補「'+cash.ticker+'」。')
      +'<br><br>總曝險 <b>'+cc.curPct.toFixed(1)+'%</b> → <b style="color:var(--gold)">'+cc.afterPct.toFixed(1)+'%</b>，配對比例約 <b>'+ratio+'% : '+(100-ratio)+'%</b>。<br>'
      +'執行後加碼金餘額 <b>$'+fmt(newCash)+'</b>'+(reserve>0?'（保留線 $'+fmt(reserve)+'）':'')+'。'
      +warnLine
      +'<br><br><span style="color:var(--muted);font-size:11px">請先完成實際下單，此按鈕只更新帳面數字。</span>',
    confirmText:'✓ 已下單，更新帳面',
    confirmColor:'var(--gold)',
    onConfirm: ()=>{
      cash.current = newCash;
      lev.current  = newLev;
      if(buying){
        if((cash.costBasis||0)>0) cash.costBasis = Math.max(0, cash.costBasis - a);
        lev.costBasis = (lev.costBasis||0) + a;
      } else {
        lev.costBasis = Math.max(0, (lev.costBasis||0) - a);
        if((cash.costBasis||0)>0) cash.costBasis = cash.costBasis + a;
      }
      // 只有「原本就以股數追蹤」的資產才更新股數；金額模式（shares=0）絕不寫入，
      // 否則價格引擎會用「僅本次股數 × 價格」覆寫金額，蒸發原有部位。
      if(lev.lastPrice && (lev.shares||0) > 0) lev.shares = Math.max(0, Math.round((lev.shares + cc.amt/lev.lastPrice)*10000)/10000);
      buildGroupCards(); buildReturnCards(); updateGroupSelect(); updateCalc();
      renderDipBuy(true);
      showCloudStatus('🎯 曝險已調整至 '+cc.afterPct.toFixed(1)+'%', 'var(--green)');
    }
  });
}

function execDipTier(i){
  const lev = dipLevAsset(), cash = dipCashAsset(lev);
  if(!lev || !cash) return;
  const t = dipBuy.tiers[i]; if(!t || t.done) return;
  const reserve = Math.max(0, dipBuy.reserve||0);
  const avail = Math.max(0, cash.current - reserve);
  const tot = totalCurrent();
  const dlv = (lev.leverage!=null?lev.leverage:1)-(cash.leverage!=null?cash.leverage:0);
  if(tot<=0 || dlv<=0) return;
  const curExpAll = assets.reduce((s,x)=>s+x.current*(x.leverage!=null?x.leverage:1),0);
  const curPct = curExpAll/tot*100;
  const pct = Math.max(0, t.pct||0);
  const amt = Math.round(avail * pct/100);
  if(pct<=0){ showCloudStatus('⚠ 此階尚未設定投入比例', 'var(--gold)'); return; }
  if(amt<=0){ showCloudStatus(reserve>0?'⚠ 可動用加碼金為 0（保留 $'+fmt(reserve)+'）':'⚠ 加碼金餘額為 0', 'var(--gold)'); return; }
  const achieved = Math.round(((curExpAll + amt*dlv)/tot*100)*10)/10;
  const clampNote = '';
  const newLev = lev.current + amt, newCash = cash.current - amt;
  const pair = newLev + newCash;
  const ratio = pair>0 ? Math.round(newLev/pair*100) : 0;
  customConfirm({
    title:'⚡ 執行第 '+(i+1)+' 階加碼',
    message:'從「'+cash.ticker+'」移轉 <b style="color:var(--gold)">$'+fmt(amt)+'</b> 至「'+lev.ticker+'」'+(fmtShares(amt,lev.lastPrice)?'（'+fmtShares(amt,lev.lastPrice)+'）':'')+'。<br><br>'
      +'總曝險 <b>'+curPct.toFixed(1)+'%</b> → <b style="color:var(--gold)">'+achieved.toFixed(1)+'%</b>，配對比例約 <b>'+ratio+'% : '+(100-ratio)+'%</b>。'+clampNote+'<br>'
      +'執行後加碼金餘額 <b>$'+fmt(newCash)+'</b>'+(reserve>0?'（≥ 保留線 $'+fmt(reserve)+'）':'')+'，目標曝險同步設為 <b>'+achieved.toFixed(1)+'%</b>。<br><br>'
      +'<span style="color:var(--muted);font-size:11px">請先完成實際下單，此按鈕只更新帳面數字。</span>',
    confirmText:'✓ 已下單，更新帳面',
    confirmColor:'var(--red)',
    onConfirm: ()=>{
      cash.current = newCash;
      lev.current  = newLev;
      if((cash.costBasis||0)>0) cash.costBasis = Math.max(0, cash.costBasis - amt);
      lev.costBasis = (lev.costBasis||0) + amt;
      if(lev.lastPrice && (lev.shares||0) > 0) lev.shares = Math.max(0, Math.round((lev.shares + amt/lev.lastPrice)*10000)/10000);
      t.done = true;
      dipBuy.targetExp = achieved;           // 執行 = 目標與現實同時抵達此階
      derivePairFromTargetExp();
      buildGroupCards(); buildReturnCards(); updateGroupSelect(); updateCalc();
      renderDipBuy(true);
      showCloudStatus('⚡ 第 '+(i+1)+' 階已執行：總曝險 '+achieved.toFixed(1)+'%', 'var(--green)');
    }
  });
}

              +'<div style="font-size:10px;color:var(--muted);margin-top:2px">'+(buying?'從「'+cash.ticker+'」支付':'回補「'+cash.ticker+'」')+sharesTxt+'</div>'

            +'</div>'

}

// ── GitHub Gist Cloud Sync ───────────────────────────────────────────────────
const GIST_FILENAME = 'portfolio-data.json';

// Bug-fix 1: suppress re-upload while applying cloud data (prevents device ping-pong loop)
let _cloudApplying = false;

// Bug-fix 2: account-aware cloud payload — Gist stores BOTH accounts {A:{...},B:{...}}
function readAccountSlice(acct){
  try {
    const raw = localStorage.getItem(accountStoreKey(acct));
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

function buildCloudState(remoteAccounts){
  const accounts = {};
  const now = Date.now();
  ['A','B'].forEach(ac=>{
    if(ac === currentAccount){
      accounts[ac] = {
        groups, assets, uid, gid, exchangeRate, dipBuy,
        withdraw: document.getElementById('withdrawInput').value,
        savedAt: now
      };
    } else {
      // 競態防護：另一帳戶取「本地副本 vs 雲端現存」中較新者，避免舊資料倒灌
      const local = readAccountSlice(ac);
      const remote = remoteAccounts ? remoteAccounts[ac] : null;
      const pick = !local ? remote
                 : !remote ? local
                 : ((remote.savedAt||0) > (local.savedAt||0) ? remote : local);
      if(pick) accounts[ac] = pick;
    }
  });
  return { version:3, savedAt: now, accounts };
}

// 上傳前先讀雲端現況（供 buildCloudState 合併用）；失敗回傳 null 不阻擋上傳
async function fetchRemoteAccounts(token, gistId){
  if(!token || !gistId) return null;
  try {
    const res = await fetch('https://api.github.com/gists/'+gistId, {
      headers:{ Authorization:'Bearer '+token }, cache:'no-store',
      signal: AbortSignal.timeout(8000)
    });
    if(!res.ok) return null;
    const data = await res.json();
    const content = data.files[GIST_FILENAME]?.content;
    if(!content) return null;
    const s = JSON.parse(content);
    return s.accounts || null;
  } catch(e){ return null; }
}

// Applies cloud state: stores every account slice locally, renders current account.
// Returns true if current account was applied. Handles legacy (version 2) format.
function applyCloudState(s){
  const accounts = s.accounts ? s.accounts : { [currentAccount]: s }; // legacy fallback
  const stamp = s.savedAt || Date.now();
  Object.keys(accounts).forEach(ac=>{
    const slice = accounts[ac];
    if(slice && slice.assets && slice.assets.length && (ac==='A'||ac==='B')){
      localStorage.setItem(accountStoreKey(ac), JSON.stringify({...slice, savedAt: slice.savedAt||stamp}));
    }
  });
  const cur = accounts[currentAccount];
  if(!(cur && cur.assets && cur.assets.length)) return false;
  groups = cur.groups||groups; assets = cur.assets;
  uid = cur.uid||Math.max(...assets.map(a=>a.id),0);
  gid = cur.gid||Math.max(...groups.map(g=>g.id),0);
  if(cur.withdraw!=null) document.getElementById('withdrawInput').value = cur.withdraw;
  if(cur.exchangeRate) exchangeRate = Number(cur.exchangeRate)||32;
  dipBuy = cur.dipBuy || defaultDipBuy();
  _cloudApplying = true;
  try {
    buildGroupCards(); buildReturnCards(); updateGroupSelect(); updateCalc();
  } finally {
    _cloudApplying = false;
  }
  return true;
}

function getGistToken(){ return localStorage.getItem('gh_gist_token')||''; }
function getGistId(){    return localStorage.getItem('gh_gist_id')||''; }

async function saveToGist(){
  const token = getGistToken();
  if(!token){ setupGistToken(); return; }
  showCloudStatus('⬆ 儲存中…', 'var(--text2)');
  const _remoteAcc2 = await fetchRemoteAccounts(token, getGistId());
  const state = buildCloudState(_remoteAcc2);
  const body = {
    description: '投資組合管理工具資料',
    public: false,
    files: { [GIST_FILENAME]: { content: JSON.stringify(state, null, 2) } }
  };
  try {
    const gistId = getGistId();
    const url = gistId
      ? 'https://api.github.com/gists/'+gistId
      : 'https://api.github.com/gists';
    const res = await fetch(url, {
      method: gistId ? 'PATCH' : 'POST',
      headers: { Authorization:'Bearer '+token, 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    });
    if(!res.ok){
      const err = await res.json();
      throw new Error(err.message||res.status);
    }
    const data = await res.json();
    localStorage.setItem('gh_gist_id', data.id);
    localStorage.setItem('gh_gist_savedAt', String(state.savedAt));
    showCloudStatus('☁ 雲端已更新 ✓', 'var(--green)');
  } catch(e){
    showCloudStatus('⚠ 儲存失敗：'+e.message, 'var(--red)');
  }
}

async function loadFromGist(){
  const token = getGistToken();
  if(!token){ setupGistToken(); return; }
  let gistId = getGistId();
  if(!gistId){
    showCloudStatus('🔍 搜尋雲端資料…', 'var(--text2)');
    gistId = await findPortfolioGist(token);
    if(!gistId){ showCloudStatus('⚠ 找不到雲端資料，請先在另一台儲存', 'var(--gold)'); return; }
  }
  showCloudStatus('⬇ 讀取中…', 'var(--text2)');
  try {
    const res = await fetch('https://api.github.com/gists/'+gistId, {
      headers: { Authorization:'Bearer '+token }
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const content = data.files[GIST_FILENAME]?.content;
    if(!content) throw new Error('找不到資料檔案');
    const s = JSON.parse(content);
    if(!s.accounts && !(s.assets&&s.assets.length)) throw new Error('資料格式錯誤');
    customConfirm({
      title:'從雲端讀取',
      message:'確定要載入雲端的資料嗎？目前的資料將被覆蓋。',
      confirmText:'載入',
      confirmColor:'var(--green)',
      onConfirm: ()=>{
        if(applyCloudState(s)){
          localStorage.setItem('gh_gist_savedAt', String(s.savedAt||Date.now()));
          showCloudStatus('☁ 雲端資料已載入 ✓', 'var(--green)');
        } else {
          showCloudStatus('⚠ 雲端沒有此帳戶的資料', 'var(--gold)');
        }
      }
    });
  } catch(e){
    showCloudStatus('⚠ 讀取失敗：'+e.message, 'var(--red)');
  }
}

function showCloudStatus(msg, color){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.textContent = msg;
  el.style.color = color||'var(--text2)';
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.opacity='0.4'; el.style.color=''; }, 4000);
}

function saveData(){
  try {
    localStorage.setItem(accountStoreKey(), JSON.stringify({
      groups: groups.map(g=>({...g})),
      assets: assets.map(a=>({...a})),
      uid, gid, exchangeRate, dipBuy,
      withdraw: document.getElementById('withdrawInput').value,
      savedAt: Date.now()
    }));
    showSaveStatus();
    scheduleGistSync(); // Auto cloud sync
  } catch(e){
    const el = document.getElementById('saveStatus');
    if(el){
      el.textContent = '⚠️ 儲存失敗 (空間不足)';
      el.style.color = 'var(--red)';
      el.style.opacity = '1';
    }
    console.warn('Save failed', e);
  }
}

function showSaveStatus(){
  const el = document.getElementById('saveStatus');
  if(el){
    const now = new Date();
    el.textContent = '已儲存 '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    el.style.opacity='1';
    clearTimeout(el._t);
    el._t = setTimeout(()=>{el.style.opacity='0.4';},2000);
  }
}

// ── Auto Cloud Sync ──────────────────────────────────────────────────────────
let _gistSyncTimer = null;

// Called after every saveData — debounced 5 seconds
function scheduleGistSync(){
  if(_cloudApplying) return; // Applying cloud data — don't echo it back up
  if(!getGistToken()) return; // No token → skip
  clearTimeout(_gistSyncTimer);
  _gistSyncTimer = setTimeout(autoSyncToGist, 2000);
  showCloudIndicator('pending');
}

// Silent auto-save to Gist
async function autoSyncToGist(){
  const token = getGistToken();
  if(!token) return;
  // Skip if rate-limited
  if(Date.now() < _rateLimitedUntil){ showCloudIndicator('error'); return; }
  showCloudIndicator('syncing');
  // 先讀雲端現況合併另一帳戶（競態防護），再組建上傳內容
  const _remoteAcc = await fetchRemoteAccounts(token, getGistId());
  const state = buildCloudState(_remoteAcc);
  const body = {
    description: '投資組合管理工具資料',
    public: false,
    files: { [GIST_FILENAME]: { content: JSON.stringify(state) } }
  };
  // Retry up to 2 times with increasing delay (handles transient network errors)
  for(let attempt=1; attempt<=2; attempt++){
    try {
      let gistId = getGistId();
      const url = gistId
        ? 'https://api.github.com/gists/'+gistId
        : 'https://api.github.com/gists';
      const res = await fetch(url, {
        method: gistId ? 'PATCH' : 'POST',
        headers: { Authorization:'Bearer '+token, 'Content-Type':'application/json' },
        body: JSON.stringify(body),
        signal: AbortSignal.timeout(10000)
      });
      // If rate limited (403), back off 15 min and stop
      if(res.status === 403){
        _rateLimitedUntil = Date.now() + 15*60*1000;
        showCloudIndicator('error');
        return;
      }
      // If gist was deleted (404), clear stale ID; next attempt creates new
      if(res.status === 404 || res.status === 422){
        localStorage.removeItem('gh_gist_id');
        continue;
      }
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      localStorage.setItem('gh_gist_id', data.id);
      localStorage.setItem('gh_gist_savedAt', String(state.savedAt));
      showCloudIndicator('ok');
      return; // Success — stop retrying
    } catch(e){
      if(attempt < 2){
        await new Promise(r=>setTimeout(r, 1500));
      } else {
        showCloudIndicator('error');
      }
    }
  }
}

// On page load: auto-load from Gist if it's newer than local data
async function autoLoadFromGist(){
  const token = getGistToken();
  if(!token) return;
  // If no Gist ID stored, try to find it by searching user's gists
  let gistId = getGistId();
  if(!gistId){
    gistId = await findPortfolioGist(token);
    if(!gistId) return; // No portfolio gist found yet
  }
  try {
    const res = await fetch('https://api.github.com/gists/'+gistId, {
      headers: { Authorization:'Bearer '+token }
    });
    if(res.status === 404){ localStorage.removeItem('gh_gist_id'); return; }
    if(!res.ok) return;
    const data = await res.json();
    const content = data.files[GIST_FILENAME]?.content;
    if(!content) return;
    const s = JSON.parse(content);
    if(!s.accounts && !(s.assets&&s.assets.length)) return;
    // Compare timestamps: only load if Gist is newer
    const localSavedAt = Number(localStorage.getItem('gh_gist_savedAt'))||0;
    const gistSavedAt = s.savedAt||0;
    if(gistSavedAt <= localSavedAt) {
      showCloudIndicator('ok');
      return; // Local is already up to date
    }
    // Gist is newer — apply silently (no echo back, account-aware)
    if(applyCloudState(s)){
      localStorage.setItem('gh_gist_savedAt', String(gistSavedAt));
      showCloudIndicator('loaded');
    }
  } catch(e){
    // Silent fail — don't bother user if background sync fails
  }
}

// Subtle cloud icon in status bar
function showCloudIndicator(state){
  const el = document.getElementById('cloudIndicator');
  if(!el) return;
  const states = {
    pending:  { text:'☁ 待同步',  color:'var(--muted)' },
    syncing:  { text:'☁ 同步中…', color:'var(--text2)' },
    ok:       { text:'☁ 已同步',  color:'var(--green)'  },
    loaded:   { text:'☁ 已載入最新', color:'var(--green)' },
    error:    { text:'☁ 同步失敗', color:'var(--red)'   },
  };
  const s = states[state]||states.ok;
  el.textContent = s.text;
  el.style.color  = s.color;
  el.style.opacity = '1';
  if(state==='ok'||state==='loaded'){
    clearTimeout(el._t);
    el._t = setTimeout(()=>{ el.style.opacity='0.35'; }, 4000);
  }
}

// ── Near-instant Gist sync (poll every 10s when visible + on focus) ─────────
let _gistPollTimer = null;

let _rateLimitedUntil = 0;
async function checkGistForUpdates(){
  const token = getGistToken();
  const gistId = getGistId();
  if(!token || !gistId) return;
  // Skip if rate-limited (back off)
  if(Date.now() < _rateLimitedUntil) return;
  // Skip if user is actively editing (an input is focused)
  if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
  try {
    const res = await fetch('https://api.github.com/gists/'+gistId, {
      headers:{ Authorization:'Bearer '+token },
      cache:'no-store'
    });
    if(res.status === 404){ localStorage.removeItem('gh_gist_id'); return; }
    if(res.status === 403){ _rateLimitedUntil = Date.now() + 15*60*1000; return; }
    if(!res.ok) return;
    const data = await res.json();
    const content = data.files[GIST_FILENAME]?.content;
    if(!content) return;
    const s = JSON.parse(content);
    if(!s.accounts && !(s.assets&&s.assets.length)) return;
    const localSavedAt = Number(localStorage.getItem('gh_gist_savedAt'))||0;
    const gistSavedAt = s.savedAt||0;
    if(gistSavedAt <= localSavedAt) return; // Already up to date
    // Gist is newer — apply silently (no echo back, account-aware)
    if(applyCloudState(s)){
      localStorage.setItem('gh_gist_savedAt', String(gistSavedAt));
      showCloudIndicator('loaded');
    }
  } catch(e){}
}

function startGistPollTimer(){
  // Poll every 10 seconds while the tab is visible
  clearInterval(_gistPollTimer);
  _gistPollTimer = setInterval(()=>{
    if(document.visibilityState === 'visible') checkGistForUpdates();
  }, 60 * 1000); // 60s poll (focus/visibility events give instant feel)
}

// Immediate check when user switches back to the app
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') checkGistForUpdates();
});
window.addEventListener('focus', ()=>{ checkGistForUpdates(); });
// When network reconnects, push local data and check for updates
window.addEventListener('online', ()=>{
  if(getGistToken()){
    autoSyncToGist();
    setTimeout(checkGistForUpdates, 2000);
  }
});

// ── Defensive save: iOS background / tab close ────────────────────────────────
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden') saveData();
});
window.addEventListener('beforeunload', ()=>{ saveData(); });
window.addEventListener('pagehide', ()=>{ saveData(); }); // iOS Safari

// ── Enter key: blur input (dismiss keyboard, don't jump to next field) ─────────
document.addEventListener('keydown', e=>{
  if(e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  // Allow modal confirm inputs (id contains 'Price' or 'Modal') to handle first
  const id = e.target.id || '';
  if(id.includes('Price') || id.includes('Modal') || id.includes('Confirm')) return;
  e.preventDefault();
  e.target.blur();
});

currentAccount = localStorage.getItem('currentAccount') || 'A';

autoLoadFromGist(); // Auto-load from cloud if new
startGistPollTimer(); // Poll Gist every 3 miner
startGistPollTimer(); // Poll for Gist updates every 3 min
buildGroupCards();
